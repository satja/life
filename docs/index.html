<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>life.py</title>
<style>:root {
  --paper: #FCFCFA;
  --ink:   #1A1D1B;
  --muted: #6B726E;
  --faint: #A9AFAB;
  --hair:  #E6E9E6;
  --accent:#1D6F6A;
  --warm:  #9A6510;
  --loss:  #96454F;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0F1213; --ink: #E4E8E5; --muted: #8E9793; --faint: #59615E;
          --hair: #1F2426; --accent: #56B8AC; --warm: #D3A054; --loss: #D2757F; }
}
:root[data-theme="dark"] {
  --paper: #0F1213; --ink: #E4E8E5; --muted: #8E9793; --faint: #59615E;
  --hair: #1F2426; --accent: #56B8AC; --warm: #D3A054; --loss: #D2757F;
}
:root[data-theme="light"] {
  --paper: #FCFCFA; --ink: #1A1D1B; --muted: #6B726E; --faint: #A9AFAB;
  --hair: #E6E9E6; --accent: #1D6F6A; --warm: #9A6510; --loss: #96454F;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--mono); font-size: 13.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 90px; }

header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
         border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
h1 { font-size: 19px; font-weight: 400; margin: 0; letter-spacing: .02em; }
.seedline { margin-left: auto; }
.lab { color: var(--faint); font-size: 10.5px; letter-spacing: .12em;
       text-transform: uppercase; }
.blurb { color: var(--muted); max-width: 66ch; margin: 16px 0 0; }
.foot { color: var(--faint); font-size: 12px; max-width: 74ch; margin: 22px 0 0; }

.controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            margin: 0 0 26px; }
input { font-family: var(--mono); font-size: 12.5px; width: 9ch; background: transparent;
        color: var(--ink); border: 1px solid var(--hair); padding: 4px 6px; }
input:focus { border-color: var(--accent); outline: none; }

/* ---- the conditions, set before anything runs ---- */
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
         gap: 20px 28px; margin: 26px 0 24px; align-items: start; }
.knob h3 { font: inherit; font-size: 10.5px; letter-spacing: .12em;
           text-transform: uppercase; color: var(--faint); margin: 0 0 5px; }
.knob .why { color: var(--muted); font-size: 11.5px; line-height: 1.5;
             margin: 0 0 9px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.seg button { font-family: var(--mono); font-size: 11.5px; background: transparent;
              color: var(--muted); border: 1px solid var(--hair); padding: 4px 9px;
              cursor: pointer; }
.seg button:hover { color: var(--ink); border-color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--paper); background: var(--accent);
                                   border-color: var(--accent); }
.seg button[aria-pressed="true"]:hover { color: var(--paper); }
button.go { font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
  text-transform: uppercase; background: var(--ink); color: var(--paper);
  border: 0; padding: 10px 20px; cursor: pointer; }
button.go:hover { background: var(--accent); }
button.ghost { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  background: transparent; color: var(--muted); border: 1px solid var(--hair);
  padding: 5px 10px; cursor: pointer; }
button.ghost:hover { color: var(--ink); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- one row, at every scale ---- */
.tree { border-top: 1px solid var(--hair); }
.node {
  display: grid;
  grid-template-columns: 1.2em 5.6em 1fr auto;
  gap: 0 10px;
  align-items: baseline;
  width: 100%;
  font: inherit;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--hair);
  padding: 3px 4px 3px calc(var(--d) * 1.35em + 4px);
  cursor: pointer;
  color: inherit;
}
.node:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.node.leaf { cursor: default; }
.node.leaf:hover { background: none; }
.node > .mark { color: var(--faint); }
.node.open > .mark { color: var(--accent); }
.node > .when { color: var(--muted); font-variant-numeric: tabular-nums;
                white-space: nowrap; text-align: right; overflow: hidden; }
.node > .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node > .tail { color: var(--faint); font-size: 11.5px; white-space: nowrap;
                font-variant-numeric: tabular-nums; }

.node.ev > .what { color: var(--ink); }
.node.ev.world > .what { color: var(--warm); }
.node.ev.loss > .what { color: var(--loss); }
.node.ev.kept > .what { color: var(--accent); }
.node.quiet > .what { color: var(--muted); }
.node.thought > .what { color: var(--muted); font-style: italic; }
.node.more > .what { color: var(--faint); }
.node.dead > .what { color: var(--faint); }
.node.head { border-bottom-color: var(--ink); padding-top: 10px; padding-bottom: 6px; }
.node.head > .what { font-size: 15px; letter-spacing: .02em; }
.node.head > .mark { color: var(--ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 620px) {
  body { font-size: 12.5px; }
  .wrap { padding: 20px 12px 60px; }
  .node { grid-template-columns: 1em 4.4em 1fr; padding-left: calc(var(--d) * .9em + 2px); }
  .node > .tail { grid-column: 2 / -1; font-size: 10.5px; }
  .seedline { margin-left: 0; }
}
</style>
</head>

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

   thinks:[["everyone in this photograph is older now","death"]]},
  {t:"war, here",kind:"war",years:4,w:4,risk:0.07,
   does:[["queueing",120],["listening for the all-clear",60],["boarding up the windows",45]],
   thinks:[["the light in a hospital corridor","death"],["whether they are all right","love"]],
   costs:"find out what happened to Marko"},
  {t:"the river takes the lower streets",kind:"nature",years:1,w:5,risk:0.02,
   does:[["carrying things upstairs",90],["drying it out",120]],
   thinks:[["water, further out than you thought","fear"]]},
  {t:"an earthquake, in the night",kind:"nature",years:1,w:4,risk:0.035,
   does:[["sleeping in the car",300],["queueing",60]],
   thinks:[["the stairs in the dark","fear"]],costs:"get it looked at"},
  {t:"the summer that would not end",kind:"nature",years:1,w:6,risk:0.018,rep:1,
   does:[["sitting in the dark with the shutters closed",140]],
   thinks:[["it is August already","time"]]},
  {t:"a winter with no coal",kind:"nature",years:1,w:5,risk:0.025,rep:1,
   does:[["keeping one room warm",150]],thinks:[["the smell of the hallway","home"]]},
  {t:"everyone stays indoors for a year",kind:"plague",years:2,w:4,risk:0.03,
   does:[["staying indoors",300],["waiting for the phone",60]],
   thinks:[["whether they are all right","love"]]},
  {t:"a bridge is built",kind:"progress",years:1,w:5,rep:1,does:[["going the new way",40]]},
  {t:"the mill is turned into flats",kind:"progress",years:1,w:5,
   thinks:[["what it used to be","home"]]},
  {t:"the trams stop running",kind:"progress",years:2,w:4,does:[["walking it instead",70]]},
];

const SMALL_THINGS = ["being laughed at by the whole table","the door closing",
  "not being believed","coming last, in front of everyone","the word he used",
  "a promise about Saturday","the silence after the question","being told you were fine"];

const SUBJECTS = {
  arithmetic:3, geography:3, history:3, biology:3,
  "the other language":2, chemistry:2, physics:2, literature:2,
};
const WORTH_KEEPING = ["long division","the other language, badly","how to look busy",
  "the word for window","how to sit through things"];

function stageAt(age) {
  if (age >= 76) return "late";
  if (age >= 65) return "old";
  if (age >= 50) return "later";
  if (age >= 35) return "middle";
  if (age >= 20) return "young";
  if (age >= 13) return "teenager";
  if (age >= 3) return "child";
  return "infant";
}

function energyAt(age) {
  if (age < 3) return 4;
  if (age < 13) return 6 + ((age / 5) | 0);
  if (age < 20) return 9;
  if (age < 36) return 10;
  if (age < 56) return 9;
  if (age < 66) return 8;
  if (age < 76) return 6;
  if (age < 86) return 4;
  return 3;
}

function frailty(age) {
  if (age < 5) return 1.6;
  if (age < 15) return 0.5;
  if (age < 45) return 0.8;
  if (age < 65) return 1.4;
  if (age < 80) return 2.5;
  return 4.0;
}

// ---------------------------------------------------------------- the life

class Life {
  constructor(opts) {
    this.opts = opts;
    this.rng = mulberry32(opts.seed >>> 0);
    this.names = []; this.nameIndex = new Map();
    this.thoughtNames = []; this.thoughtIndex = new Map();

    this.minute = 6 * 60 + 14;
    this.alive = true;
    this.grogginess = 0; this.eveningLeft = 60; this.idle = 0;
    this.lying = false; this.tempted = false; this.reminded = false;
    this.sleepAttempts = 0; this.insomniaNoted = false;
    this.dayIndex = 0; this.yearSeen = -1; this.monthSeen = -1;
    this.stage = null; this.choices = []; this.skillsKept = [];
    this.holidayFrom = -1; this.holidayTo = -1;
    this.salience = new Map(); this.scars = []; this.circumstances = [];
    this.pending = []; this.noLonger = new Set(); this.preoccupation = null;
    this.cause = null; this.diedAt = null;
    this.dials = Object.assign({}, DIALS); this.working = {}; this.dialsAt = {};

    this.canDo = []; this.mustDo = []; this.shouldDo = []; this.neverDo = [];
    this.conscious = []; this.subconscious = []; this.byTheme = new Map();

    this.mornings = 0; this.alarms = 0; this.gotRoundTo = 0;
    this.insomniaNights = 0; this.worstNight = [0, 0, ""];
    this.totalDone = 0; this.totalThoughts = 0;
    this.neverTotal = 0; this.rememberedTotal = 0;
    this.doneCount = new Map(); this.doneMinutes = new Map();
    this.thoughtCount = new Map(); this.themeCount = new Map();
    this.deepCount = 0; this.deepTexts = new Set();

    // how often each line of live.py ran, and how often it was true
    this.hits = new Array(64).fill(0);
    this.trues = new Array(64).fill(0);
    this.conds = new Set();
    this.tracing = null;

    this.days = [];            // one record per day lived
    this.events = [];          // {age, month, text, kind}
    this.worldEvents = [];
    this.seenEvents = new Set();

    this.inherit();
    this.raiseChildhood();
    this.goToSchool();
    this.timeline = this.unfoldHistory();
    this.windUp();
    this.schedule = this.buildSchedule();
  }

  hit(line, note) {
    this.hits[line]++;
    if (this.tracing) this.tracing.push([line, note === undefined ? "" : note]);
  }

  hitIf(line, truth, note) {
    this.hits[line]++;
    this.conds.add(line);
    if (truth) this.trues[line]++;
    if (this.tracing) {
      this.tracing.push([line, (truth ? "True" : "False") + (note ? " · " + note : "")]);
    }
  }

  // recompute every dial from what was given, what was done, and what is
  // going on at the moment, keeping the working so it can be read
  windUp() {
    const base = Object.assign({}, DIALS, {
      sleep: this.opts.sleepBase, conscience: this.opts.conscience,
      temptation: 1 / this.opts.temptation,
    });
    this.dials = Object.assign({}, base);
    this.working = {}; for (const k in base) this.working[k] = [];
    const lean = (source, table) => {
      for (const dial in table) {
        const [how, amount] = table[dial];
        this.working[dial].push([source, how, amount]);
        if (how === "+") this.dials[dial] += amount; else this.dials[dial] *= amount;
      }
    };
    for (const trait of Object.keys(this.given).sort()) {
      if (FROM_GENES[trait]) {
        lean(trait + " (" + (this.fromWhom[trait] || "?") + ")", FROM_GENES[trait]);
      }
    }
    for (let i = 0; i < this.unresolved.length; i++) {
      lean("carried from childhood", FROM_UPBRINGING);
    }
    for (const c of this.circumstances) {
      if (FROM_HISTORY[c.kind]) lean(c.text, FROM_HISTORY[c.kind]);
    }
    this.dials.sleep = Math.max(0.008, this.dials.sleep);
    this.dials.persistence = Math.min(0.995, this.dials.persistence);
    this.dialsAt[this.age] = { dials: Object.assign({}, this.dials),
                               working: JSON.parse(JSON.stringify(this.working)) };
  }

  rnd() { return this.rng(); }
  rint(n) { return Math.floor(this.rng() * n); }
  rrange(a, b) { return a + Math.floor(this.rng() * (b - a)); }
  pick(list) { return list[Math.floor(this.rng() * list.length)]; }
  gauss() {
    let u = 0, v = 0;
    while (u === 0) u = this.rng();
    while (v === 0) v = this.rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  nameId(s) {
    let i = this.nameIndex.get(s);
    if (i === undefined) { i = this.names.length; this.names.push(s); this.nameIndex.set(s, i); }
    return i;
  }
  thoughtId(s) {
    let i = this.thoughtIndex.get(s);
    if (i === undefined) {
      i = this.thoughtNames.length; this.thoughtNames.push(s); this.thoughtIndex.set(s, i);
    }
    return i;
  }

  get day() { return Math.floor(this.minute / MIN_DAY); }
  get hour() { return Math.floor((this.minute % MIN_DAY) / 60); }
  get age() { return Math.floor(this.day / DAYS_YEAR); }
  get month() { return Math.min(11, Math.floor((this.day % DAYS_YEAR) * 12 / DAYS_YEAR)); }
  clockTime() {
    const r = this.minute % MIN_DAY;
    return String(Math.floor(r / 60)).padStart(2, "0") + ":" + String(r % 60).padStart(2, "0");
  }
  tick(m) { this.minute += (m === undefined ? 1 : m); }

  // genes: multiple inheritance, resolved in the usual order
  inherit() {
    // the same attributes genes.py puts on the same classes, so that the
    // order Python resolves them in is the order resolved here
    const mother = ["Mother", { worry: 1, eyes: "green", everything_else: "hers",
                                patience: "with everyone but you" }];
    const father = ["Father", { worry: "about what people think", posture: "bad",
                                eyes: "grey", silence: "at the table",
                                stubbornness: "the quiet kind" }];
    // genes.py builds You with the bases in one order or the other; whichever
    // comes first is the one the resolution order reaches first
    const takesAfterMother = this.rint(2) === 0;
    this.takeAfter = takesAfterMother ? "Mother" : "Father";
    const MRO = [
      ["You", {}],
      takesAfterMother ? mother : father,
      takesAfterMother ? father : mother,
      ["Grandmother", { stubbornness: 1, recipe: "never written down", worry: "about money" }],
      ["Grandfather", { silence: "long", patience: 1 }],
      ["Ancestor", { hope: 1, fear_of_the_dark: 1, eyes: "brown",
                     worry: "about the winter", silence: "the kind you are born into",
                     posture: "from carrying things" }],
    ];
    const traits = ["hope","fear_of_the_dark","stubbornness","worry","posture","silence",
                    "recipe","eyes","patience","a way with people"];
    this.given = {}; this.fromWhom = {}; this.inheritedFrom = {};
    for (const trait of traits) {
      const dominant = this.rint(3) > 0;
      if (!dominant && this.rint(2) !== 0) continue;
      for (let i = 0; i < MRO.length; i++) {
        if (trait in MRO[i][1]) { this.given[trait] = true; break; }
      }
      if (!(trait in this.given)) continue;
      // inherit() walks the order forwards and stops at the nearest;
      // blame() walks it backwards and reaches the furthest
      for (let i = 0; i < MRO.length; i++) {
        if (trait in MRO[i][1]) { this.inheritedFrom[trait] = MRO[i][0]; break; }
      }
      for (let i = MRO.length - 1; i >= 0; i--) {
        if (trait in MRO[i][1]) { this.fromWhom[trait] = MRO[i][0]; break; }
      }
    }
    let span = this.opts.allotted;
    if (!span) {
      span = 68 + this.rrange(-11, 22);
      if (this.given.stubbornness) span += 4;
      if (this.given.worry) span -= 2;
    }
    this.lifespan = span;
  }

  // upbringing: what gets appended, and when it comes back out
  raiseChildhood() {
    this.unresolved = []; this.raised = null;
    for (let age = 0; age < 7; age++) {
      if (this.rint(3) > 0) continue;
      const hurt = this.pick(SMALL_THINGS);
      if (this.rint(3) === 0) this.unresolved.push(hurt);
    }
    let age = 17;
    while (this.unresolved.length > 0) {
      const thing = this.unresolved.pop();
      age += 1;
      if (age > 79) return;
      if (this.rint(10) > 0) this.unresolved.unshift(thing);
      else { this.raised = [age, thing]; return; }
    }
  }

  // education: understanding does not terminate, the bell does
  goToSchool() {
    const subjects = Object.keys(SUBJECTS);
    this.curiousAbout = [this.pick(subjects), this.pick(subjects)];
    this.questions = 0; this.notUnderstood = new Set(); this.skills = [];
    let grades = 0, taken = 0;
    const understand = (subject) => {
      if (!this.curiousAbout.includes(subject)) { this.notUnderstood.add(subject); return; }
      let open = 1, guard = 0;
      while (open > 0 && guard++ < 4000) {
        if (this.rint(45) === 0) break;
        open += this.rrange(2, 4) - 1;
      }
      this.questions += open;
    };
    for (let year = 0; year < 12; year++) {
      for (let k = 0; k < 3; k++) {
        const subject = this.pick(subjects);
        const facts = SUBJECTS[subject];
        let right = 0;
        for (let f = 0; f < facts; f++) if (this.rint(3) === 0) right++;
        grades += Math.round(1 + 4 * right / facts); taken++;
      }
      if (this.rint(3) === 0) understand(this.pick(subjects));
      if (this.rint(4) === 0) understand(this.pick(this.curiousAbout));
    }
    this.average = taken ? grades / taken : 0;
    for (const skill of WORTH_KEEPING) if (this.rint(3) > 0) this.skills.push(skill);
  }

  unfoldHistory() {
    const out = [], spent = new Set();
    const rate = this.opts.turbulence;
    let age = 2;
    while (age < 101) {
      if (this.rnd() < rate) {
        const candidates = WORLD.filter((e) => e.rep || !spent.has(e.t));
        if (!candidates.length) break;
        let total = 0;
        for (const e of candidates) total += e.w;
        let cut = this.rnd() * total, chosen = candidates[candidates.length - 1];
        for (const e of candidates) { cut -= e.w; if (cut <= 0) { chosen = e; break; } }
        out.push([age, chosen]);
        spent.add(chosen.t);
        age += Math.max(1, chosen.years);
      } else age += 1;
    }
    return out;
  }

  buildSchedule() {
    const plan = new Map();
    const add = (age, text, effect) => {
      if (!plan.has(age)) plan.set(age, []);
      plan.get(age).push([text, effect || null]);
    };
    add(1, "says a word, on purpose");
    add(6, "starts school");
    add(18, "leaves school with a certificate stating that you can be taught");
    add(18, "average mark: " + this.average.toFixed(1));
    add(this.rrange(15, 20), "falls in love, silently");
    add(this.rrange(19, 26), "first job");
    add(this.rrange(20, 29), "moves out for good");
    if (this.rint(3) > 0) add(this.rrange(26, 39), "becomes a parent, and promises not to", "parent");
    if (this.rint(2) === 0) add(this.rrange(30, 55), "stops speaking to someone");
    const buriesFather = this.rrange(37, 72);
    add(buriesFather, "your father dies", "father");
    add(Math.min(96, buriesFather + this.rrange(0, 15)), "your mother dies", "mother");
    add(66, "stops going to work");
    if (this.raised) add(this.raised[0],
      "raises it — " + this.raised[1] + " — at someone who was not there");
    return plan;
  }

  // ------------------------------------------------------------ the machinery

  refreshMind() {
    const age = this.age;
    let thoughts = THOUGHTS[stageAt(age)].slice();
    for (const c of this.circumstances) if (c.thinks) thoughts = thoughts.concat(c.thinks);
    if (!this.preoccupation || this.preoccupation[1] <= age) {
      this.preoccupation = [this.pick(thoughts), age + this.rrange(2, 8), age];
    }
    thoughts = thoughts.concat([this.preoccupation[0], this.preoccupation[0], this.preoccupation[0]]);
    this.conscious = thoughts.map((t) => ({ text: t[0], theme: t[1], deep: false }));
    this.subconscious = DEEP.filter((d) => age >= d[2])
      .map((d) => ({ text: d[0], theme: d[1], deep: true })).concat(this.scars);
    this.neverDo = age >= 13
      ? NEVER_DO.map((n) => ({ name: n, kind: 3, minutes: this.rrange(5, 40) })) : [];
    this.byTheme = new Map();
    for (const t of this.conscious.concat(this.subconscious)) {
      if (!this.byTheme.has(t.theme)) this.byTheme.set(t.theme, []);
      this.byTheme.get(t.theme).push(t);
    }
  }

  remember(text, theme) {
    if (this.scars.length >= 8) return;
    if (this.scars.some((s) => s.text === text)) return;
    const t = { text, theme, deep: true };
    this.scars.push(t); this.subconscious.push(t);
    if (!this.byTheme.has(theme)) this.byTheme.set(theme, []);
    this.byTheme.get(theme).push(t);
  }

  restock() {
    let choices = CAN_DO[this.stage].slice();
    for (const s of this.skillsKept) choices.push([s, 45]);
    for (const c of this.circumstances) if (c.does) choices = choices.concat(c.does);
    choices = choices.concat(SEASON[SEASONS[this.month]]);
    const already = new Set(), distinct = [];
    for (const [name, minutes] of choices) {
      if (!already.has(name)) { already.add(name); distinct.push([name, minutes]); }
    }
    this.choices = distinct;
  }

  drift() {
    for (const [name] of this.choices) {
      if (!this.salience.has(name)) this.salience.set(name, BASE[name] || 1.0);
    }
    for (const [name, value] of this.salience) {
      const anchor = Math.log(BASE[name] || 1.0);
      const moved = anchor + 0.96 * (Math.log(value) - anchor) + this.gauss() * 0.14;
      this.salience.set(name, Math.min(4.0, Math.max(0.15, Math.exp(moved))));
    }
  }

  weightedPick(choices, wanted) {
    const scored = [];
    for (let i = 0; i < choices.length; i++) {
      const [name, minutes] = choices[i];
      const w = this.salience.get(name) || 1.0;
      scored.push([Math.pow(this.rnd(), 1.0 / w), name, minutes]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    return scored.slice(0, wanted).map((s) => [s[1], s[2]]);
  }

  note(text, kind) {
    if (this.seenEvents.has(text)) return;
    this.seenEvents.add(text);
    this.events.push({ age: this.age, month: this.month, day: this.day, text, kind });
  }

  takePlace(event) {
    // a circumstance arrives at a birthday but is dated to a month, and the
    // month has to be a day you actually lived, or it cannot be zoomed into
    const age = this.age, month = this.rint(12);
    const day = age * DAYS_YEAR + Math.floor(month * DAYS_YEAR / 12) + this.rint(27);
    this.circumstances.push({
      text: event.t, until: age + event.years, kind: event.kind,
      risk: (event.risk || 0) * this.opts.lethality,
      does: event.does || [], thinks: event.thinks || [],
    });
    this.worldEvents.push({ age, month, text: event.t, kind: event.kind });
    this.events.push({ age, month, day, text: event.t, kind: "world" });
    if (event.costs) this.owe(event.costs);
  }

  owe(name) {
    if (this.noLonger.has(name)) return;
    if (this.shouldDo.some((d) => d.name === name)) return;
    this.shouldDo.push({ name, kind: 2, minutes: this.rrange(20, 120) });
  }

  takeEffect(key) {
    const age = this.age;
    if (key === "parent") {
      this.circumstances.push({
        text: "a child", until: age + 18, risk: 0, kind: "child",
        does: [["carrying someone who is asleep", 60], ["reading the same book aloud", 30],
               ["worrying about someone else", 45]],
        thinks: [["whether they are all right", "love"]],
      });
    } else if (key === "father") {
      this.remember("the silence at the table", "death");
    } else if (key === "mother") {
      this.remember("the hallway, empty", "death");
      this.noLonger.add("call your mother");
      this.shouldDo = this.shouldDo.filter((d) => d.name !== "call your mother");
      this.motherDied = age;
    }
  }

  die(cause) {
    this.alive = false;
    this.diedAt = [this.age, this.clockTime()];
    this.cause = cause;
    this.pending = [];
    this.events.push({ age: this.age, month: this.month, day: this.day,
                       text: "does not get up", kind: "end" });
    this.canDo = [];
  }

  birthday(age) {
    this.circumstances = this.circumstances.filter((c) => c.until > age);
    for (const [start, event] of this.timeline) if (start === age) this.takePlace(event);
    this.windUp();
    if (age > this.lifespan) { this.die(null); return; }
    for (const c of this.circumstances) {
      const chance = c.risk * frailty(age) * this.dials.frailty;
      if (chance && this.rnd() < chance) { this.die(c.text); return; }
    }
    this.pending = (this.schedule.get(age) || []).map((e) => [this.rint(12), e[0], e[1]]);
    this.schedule.delete(age);
    this.offerSomething(age);
    this.stage = stageAt(age);
    const keeping = (52 - age) / 32.0;
    this.skillsKept = this.skills.filter(() => age >= 20 && age < 52 && this.rnd() < keeping);
    this.monthSeen = -1;
    if (age >= 5 && age < 66) {
      this.holidayFrom = this.rrange(176, 232);
      this.holidayTo = this.holidayFrom + this.rrange(12, 25);
    } else { this.holidayFrom = this.holidayTo = -1; }
    this.refreshMind();
  }

  offerSomething(age) {
    if (age < 5 || this.rint(4) > 0) return;
    if (this.shouldDo.length >= 9) return;
    const onList = this.shouldDo.map((d) => d.name);
    const left = SHOULD_DO.filter((s) => !onList.includes(s) && !this.noLonger.has(s));
    if (left.length) this.owe(this.pick(left));
  }

  firePending() {
    const later = [];
    for (const [month, text, effect] of this.pending) {
      if (month !== this.month) { later.push([month, text, effect]); continue; }
      this.note(text, effect === "father" || effect === "mother" ? "loss" : "milestone");
      if (effect) this.takeEffect(effect);
    }
    this.pending = later;
  }

  newMonth() { this.monthSeen = this.month; this.firePending(); this.restock(); this.drift(); }

  morningOf(full) {
    this.mornings++;
    this.dayIndex = this.day;
    this.sleepAttempts = 0; this.insomniaNoted = false; this.lying = false;
    this.eveningLeft = this.rrange(30, 150);
    const age = this.age;
    if (age !== this.yearSeen) { this.yearSeen = age; this.birthday(age); }
    if (!this.alive) { this.canDo = []; return; }
    if (this.month !== this.monthSeen) this.newMonth();
    const energy = energyAt(age) - (full ? 0 : 1);
    const doy = this.day % DAYS_YEAR;
    const away = doy >= this.holidayFrom && doy < this.holidayTo;
    let pool = this.choices;
    if (away) {
      pool = pool.filter((c) => !WORK.has(c[0]) && !TERM_ONLY.has(c[0])).concat(HOLIDAY);
    } else if (age < 20 && doy >= 172 && doy < 244) {
      pool = pool.filter((c) => !TERM_ONLY.has(c[0]));
    }
    this.canDo = this.weightedPick(pool, Math.max(1, energy)).map(
      ([name, minutes]) => ({ name, kind: 0, minutes }));
    if (!away && this.mustDo.length < 9 && this.rint(2) === 0) {
      let owed = MUST_DO[this.stage];
      if (doy >= 172 && doy < 244) owed = owed.filter((o) => !SCHOOL.has(o));
      if (owed.length) {
        this.mustDo.push({ name: this.pick(owed), kind: 1, minutes: this.rrange(20, 90) });
      }
    }
    this.tempted = this.rnd() < this.dials.temptation;
    this.reminded = false;
  }

  doThing(thing) {
    // where the day was when this began, and how far the day's thinking had
    // got — so a thing done can be placed in the day and carry the thoughts
    // that led up to it
    const began = this.minute % MIN_DAY;
    const thoughtsSoFar = this.record.thoughts.length;
    this.tick(thing.minutes);
    this.record.acts.push(thing.kind, this.nameId(thing.name), thing.minutes,
                          began, thoughtsSoFar);
    this.record.busy += thing.minutes;
    this.totalDone++;
    this.doneCount.set(thing.name, (this.doneCount.get(thing.name) || 0) + 1);
    this.doneMinutes.set(thing.name,
      (this.doneMinutes.get(thing.name) || 0) + thing.minutes);
    if (thing.kind === 3) {
      this.record.never++; this.neverTotal++;
      if (this.rint(9) === 0) {
        this.remember(thing.name + ", again", REGRET[thing.name] || "shame");
      }
    } else {
      if (thing.kind === 2) {
        this.reminded = false; this.gotRoundTo++; this.record.should++;
        this.events.push({ age: this.age, month: this.month, day: this.day,
                           text: "gets round to it — " + thing.name, kind: "kept" });
      }
      for (const pool of [this.canDo, this.mustDo, this.shouldDo]) {
        const at = pool.indexOf(thing);
        if (at >= 0) { pool.splice(at, 1); break; }
      }
    }
    this.idle += Math.round(this.rint(3) * this.dials.restless);
    this.tempted = this.rnd() < this.dials.temptation;
    if (!this.reminded && this.rnd() < this.dials.conscience) {
      this.reminded = true; this.record.remembered++; this.rememberedTotal++;
    }
  }

  think(thought) {
    this.tick(this.rrange(1, 4));
    this.idle--;
    this.totalThoughts++;
    this.record.thoughts.push(this.thoughtId(thought.text));
    this.thoughtCount.set(thought.text, (this.thoughtCount.get(thought.text) || 0) + 1);
    this.themeCount.set(thought.theme, (this.themeCount.get(thought.theme) || 0) + 1);
    if (thought.deep) { this.deepCount++; this.deepTexts.add(thought.text); }
  }

  related(thought) { return this.byTheme.get(thought.theme) || this.conscious; }

  thinkAboutStuff() {
    const all = this.subconscious.concat(this.conscious);
    if (!all.length) return;
    let thought = this.pick(all);
    this.hit(29, thought.text);
    let guard = 0;
    for (;;) {
      const idle = this.idle > 0;
      this.hitIf(30, idle, idle ? "" : "something to do");
      if (!idle || guard++ >= 400) break;
      this.hit(31, thought.text);
      this.think(thought);
      const near = this.rint(10) > 0;
      this.hitIf(32, near);
      if (near) { thought = this.pick(this.related(thought)); this.hit(33, thought.text); }
      else { thought = this.pick(all); this.hit(35, thought.text); }
    }
  }

  // live.py, faithfully: a condition costs a minute to check
  stillSleepy() { this.tick(); if (this.grogginess <= 0) return false; this.grogginess--; return true; }
  mustWakeUp() {
    this.tick();
    const age = this.age;
    if (age < 6 || age >= 66 || !this.alive) return false;
    const d = this.day % 7;
    return d !== 5 && d !== 6;
  }
  lyingDown() {
    this.tick();
    if (this.lying) return true;
    this.eveningLeft--;
    if (this.eveningLeft <= 0) { this.lying = true; this.idle += this.rrange(2, 9); return true; }
    return false;
  }
  isMorning() {
    this.tick();
    if (this.hour >= 3 && this.hour < 7) {
      if (!this.insomniaNoted) { this.insomniaNoted = true; this.insomniaNights++; }
      return true;
    }
    return false;
  }

  getUp() { this.grogginess = 0; this.morningOf(true); }
  doWhateverItTakes() {
    this.tick(this.rrange(5, 25)); this.grogginess = 0; this.alarms++;
    this.record.alarm = true; this.morningOf(false);
  }

  fallAsleep() {
    if (!this.alive) { this.night(); return true; }
    this.tick(this.rrange(1, 5));
    this.sleepAttempts++;
    this.idle += this.rint(2);
    const chance = this.dials.sleep + 0.012 * this.sleepAttempts;
    if (this.rnd() < chance) { this.night(); return true; }
    return false;
  }

  night() {
    if (this.insomniaNoted && this.sleepAttempts > this.worstNight[0]) {
      this.worstNight = [this.sleepAttempts, this.age, this.clockTime()];
    }
    this.record.attempts = this.sleepAttempts;
    this.record.asleep = this.minute % MIN_DAY;
    this.record.insomnia = this.insomniaNoted;
    const wake = 6 * 60 + this.rint(150);
    const target = (this.dayIndex + 1) * MIN_DAY + wake;
    this.minute = Math.max(target, this.minute + 45);
    this.grogginess = this.rint(45);
    this.lying = false;
  }

  wakeUp() {
    let guard = 0;
    for (;;) {
      const sleepy = this.stillSleepy();
      this.hitIf(5, sleepy, sleepy ? "grogginess " + this.grogginess : "");
      if (!sleepy || guard++ >= 600) break;
      const must = this.mustWakeUp();
      this.hitIf(6, must);
      if (must) {
        this.hit(7); this.doWhateverItTakes();
        this.hit(8, "to an alarm, at " + this.clockTime());
        return;
      }
      this.hit(10);
    }
    this.getUp();
    this.hit(11, this.canDo.length + " things you can do today");
  }

  liveADay() {
    let guard = 0;
    for (;;) {
      const more = this.canDo.length > 0;
      this.hitIf(38, more, more ? this.canDo.length + " left" : "the day is spent");
      if (!more || guard++ >= 200) break;
      this.hit(39); this.thinkAboutStuff();

      const must = this.mustDo.length > 0;
      this.hitIf(41, must, must ? this.mustDo.length : "");
      if (must) {
        const now = this.rint(2) === 0;
        this.hitIf(42, now);
        if (now) {
          const thing = this.pick(this.mustDo);
          this.hit(43, thing.name); this.hit(44, thing.minutes + " min");
          this.doThing(thing);
        }
      }

      const should = this.reminded && this.shouldDo.length > 0;
      this.hitIf(46, should, should ? "in view" : "len() is 0");
      if (should) {
        const now = this.rint(3) === 0;
        this.hitIf(47, now);
        if (now) {
          const thing = this.pick(this.shouldDo);
          this.hit(48, thing.name); this.hit(49, thing.minutes + " min");
          this.doThing(thing);
        }
      }

      const never = this.tempted && this.neverDo.length > 0;
      this.hitIf(51, never, never ? "tempted" : "len() is 0");
      if (never) {
        const now = this.rint(4) === 0;
        this.hitIf(52, now);
        if (now) {
          const thing = this.pick(this.neverDo);
          this.hit(53, thing.name); this.hit(54, thing.minutes + " min");
          this.doThing(thing);
        }
      }

      if (!this.canDo.length) break;
      const thing = this.pick(this.canDo);
      this.hit(56, thing.name); this.hit(57, thing.minutes + " min");
      this.doThing(thing);
      this.hit(59); this.thinkAboutStuff();
    }
  }

  sleepNow() {
    let guard = 0;
    for (;;) {
      const down = this.lyingDown();
      this.hitIf(14, !down, down ? "lying down at " + this.clockTime() : "");
      if (down || guard++ >= 400) break;
      this.hit(15);
    }
    let attempts = 0;
    this.hit(16, "0");
    guard = 0;
    for (;;) {
      const asleep = this.fallAsleep();
      this.hitIf(17, !asleep, asleep ? "asleep at " + this.clockTime() : "not yet");
      if (asleep || guard++ >= 300) break;
      this.hit(18); this.thinkAboutStuff();
      attempts++; this.hit(20, String(attempts));
      this.hitIf(21, attempts === 50);
      if (attempts === 50) { this.hit(22); this.tick(this.rrange(2, 10)); }
      this.hitIf(23, attempts > 50);
      if (attempts > 50) { this.hit(24); this.tick(1); }
      const dawn = this.isMorning();
      this.hitIf(25, dawn, dawn ? "still awake at " + this.clockTime() : "");
      if (dawn) this.hit(26, "True");
    }
  }

  // one full day, recorded
  step() {
    if (!this.alive) return false;
    this.record = { age: 0, month: 0, wake: 0, busy: 0, acts: [], thoughts: [],
                    attempts: 0, asleep: 0, insomnia: false, never: 0, should: 0,
                    remembered: 0, alarm: false };
    const startedAt = this.minute;
    this.wakeUp();
    this.record.age = this.age; this.record.month = this.month;
    this.record.wake = startedAt % MIN_DAY;
    this.record.dayOfLife = this.dayIndex;
    if (this.alive) { this.liveADay(); this.sleepNow(); }
    else { this.record.asleep = this.minute % MIN_DAY; }
    this.days.push(this.record);
    return true;
  }

  traceOneDay(age) {
    const twin = new Life(this.opts);
    let guard = 0;
    while (twin.alive && twin.age < age && guard++ < 200) twin.stepYear();
    twin.tracing = [];
    twin.step();
    return twin.tracing;
  }

  stepYear() {
    const target = this.age + 1;
    let guard = 0;
    while (this.alive && this.age < target && guard++ < 500) this.step();
    if (!this.alive && this.days.length && !this.finished) this.finished = true;
    return this.alive;
  }
}

</script>
<script>// One row, at every scale. A life is a tree: years contain months contain
// days contain the things you did contain the thoughts you had on the way.
// A year also contains the six numbers the loop was reading that year, and
// each of those contains its working — what you were given, what was done to
// you, and what happened to be going on.
//
// Nothing here knows how deep it is. Every level uses the same rule:
// show the children something happened in, and count the rest.

const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = (n) => n.toLocaleString("en-US");

// what the knobs are set to, in the units the engine wants
const PRESETS = {
  century: [{ turbulence: 0.030, lethality: 0.4 }, { turbulence: 0.075, lethality: 1.0 },
            { turbulence: 0.130, lethality: 1.8 }, { turbulence: 0.200, lethality: 3.0 }],
  conscience: [1 / 60000, 1 / 26000, 1 / 8000, 1 / 1500],
  temptation: [30, 12, 6, 3],
  sleep: [0.02, 0.05, 0.12],
};

const state = {
  life: null, years: null,
  lang: (navigator.language || "en").startsWith("hr") ? "hr" : "en",
  seed: Math.floor(Math.random() * 1e6),
  set: { century: 1, conscience: 1, temptation: 1, sleep: 1 },
  open: new Set(),           // which rows are unfolded
  more: new Set(),           // which "… n more" rows have been asked for
  nodes: new Map(),          // what is on screen, so a click can be answered
};
const t = (k) => UI[state.lang][k];

const CAP = 12;              // more children than this and the quiet ones fold away

// which line of live.py reads which dial. The lines are not shown any more,
// but a number is worth less if you cannot say where it is read.
const READS_AT = { sleep: 17, restless: 30, conscience: 46, temptation: 51 };
const SHOW = { sleep: 4, restless: 3, conscience: 6, temptation: 4,
               persistence: 3, frailty: 3 };

// ------------------------------------------------------------------ the life

const clock = (m) =>
  String(Math.floor((m % 1440) / 60)).padStart(2, "0") + ":" +
  String(m % 60).padStart(2, "0");

const CLS = { world: "ev world", loss: "ev loss", kept: "ev kept",
              milestone: "ev", end: "ev dead" };

// one pass over every day lived, which is the only pass there is: months and
// years are what the days add up to, and are not stored anywhere else
function indexLife(life) {
  const years = [], byDay = new Map();
  for (const rec of life.days) {
    let y = years[rec.age];
    if (!y) y = years[rec.age] = { age: rec.age, months: [], events: [], mins: new Map() };
    let mo = y.months[rec.month];
    if (!mo) mo = y.months[rec.month] = { age: rec.age, m: rec.month, days: [],
                                          events: [], mins: new Map() };
    rec.mo = mo; rec.events = [];
    mo.days.push(rec);
    byDay.set(rec.dayOfLife, rec);
    for (let i = 0; i < rec.acts.length; i += 5) {
      const name = life.names[rec.acts[i + 1]];
      mo.mins.set(name, (mo.mins.get(name) || 0) + rec.acts[i + 2]);
    }
  }
  for (const y of years) {
    for (const mo of y.months) {
      if (!mo) continue;
      for (const [k, v] of mo.mins) y.mins.set(k, (y.mins.get(k) || 0) + v);
    }
    y.months = y.months.filter(Boolean);
  }
  const lastDay = life.days.length ? life.days[life.days.length - 1].dayOfLife : 0;
  for (const e of life.events) {
    const rec = byDay.get(Math.min(e.day, lastDay));
    if (!rec) continue;
    rec.events.push(e); rec.mo.events.push(e); years[rec.age].events.push(e);
  }
  return years;
}

function mostly(mins) {
  let best = "", bv = -1;
  for (const [k, v] of mins) if (v > bv) { bv = v; best = k; }
  return best ? t("mostly") + " " + best : "";
}

function said(events) {
  return { what: events.map((e) => e.text).join(" · "),
           cls: CLS[events[0].kind] || "ev" };
}

function hours(mins) {
  let total = 0;
  for (const v of mins.values()) total += v;
  return fmt(Math.round(total / 60)) + " h";
}

function dayLabel(rec) {
  const mins = new Map(), names = state.life.names;
  for (let i = 0; i < rec.acts.length; i += 5) {
    const name = names[rec.acts[i + 1]];
    mins.set(name, (mins.get(name) || 0) + rec.acts[i + 2]);
  }
  return mostly(mins);
}

// ------------------------------------------------------------------ nodes

function node(id, kind, o) { return Object.assign({ id: id, kind: kind }, o); }

function roots() {
  const life = state.life;
  if (!life) return [];
  return [
    node("life", "life", { cls: "head", what: t("aLife"), leaf: false,
                           tail: life.diedAt[0] + " " + t("years") }),
    node("acct", "acct", { cls: "head", what: t("account"), leaf: false }),
  ];
}

// where a dial starts before anything has leaned on it, which is what the
// knobs above set
function baseOf(dial) {
  const o = state.life.opts;
  return dial === "conscience" ? o.conscience
       : dial === "temptation" ? 1 / o.temptation
       : dial === "sleep" ? o.sleepBase : DIALS[dial];
}

// the dials as they stood in a given year, which is where they are turned
function dialsAt(age) {
  const life = state.life;
  let at = age;
  while (at >= 0 && !life.dialsAt[at]) at--;
  return at < 0 ? null : life.dialsAt[at];
}

function thoughtNodes(rec, from, to, prefix) {
  const out = [];
  for (let i = from; i < to; i++) {
    out.push(node(prefix + "/t" + i, "thought", {
      cls: "thought", what: state.life.thoughtNames[rec.thoughts[i]],
      leaf: true, notable: true,
    }));
  }
  return out;
}

function childrenOf(n) {
  const life = state.life;
  switch (n.kind) {
    case "life":
      return state.years.map(function (y) {
        const ev = y.events.length ? said(y.events)
                                   : { what: mostly(y.mins), cls: "quiet" };
        return node("life/y" + y.age, "year", {
          when: String(y.age), what: ev.what, cls: ev.cls, y: y,
          tail: stageAt(y.age), notable: y.events.length > 0, leaf: false,
        });
      });

    case "year": {
      const out = n.y.months.map(function (mo) {
        const ev = mo.events.length ? said(mo.events)
                                    : { what: mostly(mo.mins), cls: "quiet" };
        return node(n.id + "/m" + mo.m, "month", {
          when: MONTHS[mo.m], what: ev.what, cls: ev.cls, mo: mo,
          tail: hours(mo.mins), notable: mo.events.length > 0, leaf: !mo.days.length,
        });
      });
      // twelve months and the six numbers the loop read while they passed
      out.push(node(n.id + "/dials", "dials", {
        what: t("theDials"), cls: "ev world", tail: "world.py:wind_up",
        age: n.y.age, leaf: false, notable: true,
      }));
      return out;
    }

    case "month":
      return n.mo.days.map(function (rec) {
        const ev = rec.events.length ? said(rec.events)
                                     : { what: dayLabel(rec), cls: "quiet" };
        const dom = (rec.dayOfLife % 365) - Math.floor(rec.month * 365 / 12) + 1;
        return node(n.id + "/d" + rec.dayOfLife, "day", {
          when: dom + " " + MONTHS[rec.month], what: ev.what, cls: ev.cls, rec: rec,
          tail: clock(rec.wake) + "–" + clock(rec.asleep),
          notable: rec.events.length > 0 || rec.insomnia,
          leaf: !rec.acts.length && !rec.thoughts.length,
        });
      });

    case "day": {
      const rec = n.rec, out = [];
      let seen = 0;
      for (let i = 0; i < rec.acts.length; i += 5) {
        const kind = rec.acts[i], upTo = rec.acts[i + 4];
        out.push(node(n.id + "/a" + i, "act", {
          when: clock(rec.acts[i + 3]), what: life.names[rec.acts[i + 1]],
          tail: rec.acts[i + 2] + " min",
          cls: kind === 3 ? "ev loss" : kind === 2 ? "ev kept" : kind === 1 ? "quiet" : "",
          rec: rec, at: seen, upTo: upTo, leaf: upTo <= seen, notable: kind !== 0,
        }));
        seen = upTo;
      }
      // whatever was still being thought after the last thing done belongs to
      // the night, which is where the loop spends what it cannot spend awake
      if (rec.thoughts.length > seen) {
        out.push(node(n.id + "/night", "night", {
          when: clock(rec.asleep), rec: rec, at: seen,
          cls: rec.insomnia ? "ev loss" : "quiet",
          what: rec.insomnia ? t("stillAwake") : t("asleep"),
          tail: rec.attempts ? t("attempts").replace("%", fmt(rec.attempts)) : "",
          leaf: false, notable: rec.insomnia,
        }));
      }
      return out;
    }

    case "act": return thoughtNodes(n.rec, n.at, n.upTo, n.id);
    case "night": return thoughtNodes(n.rec, n.at, n.rec.thoughts.length, n.id);

    case "dials": {
      const at = dialsAt(n.age);
      if (!at) return [];
      return Object.keys(at.dials).map((dial) => node(n.id + "/" + dial, "dial", {
        what: dial + " = " + at.dials[dial].toFixed(SHOW[dial]),
        tail: t("readBy") + " " + (READS_AT[dial] ? "live.py:" + READS_AT[dial]
                                                  : "world.py"),
        working: at.working[dial] || [], value: at.dials[dial], dial: dial,
        cls: "ev", leaf: false, notable: true,
      }));
    }
    case "dial": {
      const dp = SHOW[n.dial];
      let sum = baseOf(n.dial);
      const out = [node(n.id + "/base", "leafrow", {
        when: sum.toFixed(dp), what: t("base"), cls: "quiet", leaf: true,
      })];
      n.working.forEach(function (w, i) {
        const how = w[1], amount = w[2];
        sum = how === "+" ? sum + amount : sum * amount;
        out.push(node(n.id + "/w" + i, "leafrow", {
          when: how === "+" ? (amount > 0 ? "+" : "") + amount.toFixed(dp)
                            : "×" + amount.toFixed(2),
          what: w[0], cls: "", leaf: true,
        }));
      });
      // the working does not always get the last word; two of the dials are
      // held at a limit, and it is worth saying so where it happens
      if (Math.abs(sum - n.value) > Math.pow(10, -dp) / 2) {
        out.push(node(n.id + "/held", "leafrow", {
          when: n.value.toFixed(dp), what: t("asFar"), cls: "ev world", leaf: true,
        }));
      }
      return out;
    }

    // ---- what it came to
    case "acct": return account();
    case "trait":
      return Object.keys(FROM_GENES[n.trait] || {}).map(function (dial) {
        const how = FROM_GENES[n.trait][dial][0], amount = FROM_GENES[n.trait][dial][1];
        return node(n.id + "/" + dial, "leafrow", {
          when: how === "+" ? (amount > 0 ? "+" : "") + amount.toFixed(SHOW[dial])
                            : "×" + amount.toFixed(2),
          what: dial, cls: "ev",
          tail: t("readBy") + " " + (READS_AT[dial] ? "live.py:" + READS_AT[dial]
                                                    : "world.py"),
          leaf: true, notable: true,
        });
      });
    case "list":
      return n.items.map((s, i) => node(n.id + "/i" + i, "leafrow",
                                        { what: s, cls: "quiet", leaf: true }));
    case "goto": {
      const y = state.years[n.age];
      if (!y) return [];
      return [node(n.id + "/y", "year", {
        when: String(y.age), what: mostly(y.mins), cls: "quiet", y: y,
        tail: stageAt(y.age), leaf: false,
      })];
    }
    default: return [];
  }
}

// ------------------------------------------------------------------ account

function account() {
  const life = state.life, out = [];
  const plain = (when, what, cls) =>
    node("acct/r" + out.length, "leafrow",
         { when: when, what: what, cls: cls || "quiet", leaf: true });

  out.push(node("acct/genes", "held", {
    what: "You(" + (life.takeAfter === "Mother" ? "Mother, Father" : "Father, Mother") + ")",
    cls: "ev", tail: t("inOrder"), leaf: false,
    kids: Object.keys(life.fromWhom).map((trait) => node("acct/genes/" + trait, "trait", {
      what: trait, trait: trait, cls: FROM_GENES[trait] ? "ev kept" : "quiet",
      tail: life.inheritedFrom[trait] +
            (life.inheritedFrom[trait] === life.fromWhom[trait]
              ? "" : " ← " + life.fromWhom[trait]),
      leaf: !FROM_GENES[trait], notable: true,
    })),
  }));

  const last = life.days[life.days.length - 1];
  out.push(node("acct/died", "held", {
    when: String(life.diedAt[0]),
    what: t("died") + " " + life.diedAt[1] +
          (life.cause ? ", " + t("inTheYearOf") + " " + life.cause : ""),
    cls: "ev dead", leaf: !last,
    kids: last ? [node("acct/died/d", "day", {
      when: clock(last.wake) + "–" + clock(last.asleep), what: dayLabel(last),
      cls: "quiet", rec: last, leaf: !last.acts.length,
    })] : [],
  }));

  out.push(plain(fmt(life.mornings), t("mornings")));
  out.push(plain(fmt(life.totalDone), t("thingsDone")));
  out.push(plain(fmt(life.totalThoughts), t("thoughts") + ", " +
                 fmt(life.thoughtCount.size) + " " + t("different")));
  out.push(plain(fmt(life.neverTotal), t("knewBetter")));
  out.push(plain(fmt(life.gotRoundTo), t("gotRoundTo"), "ev kept"));
  out.push(plain(fmt(life.insomniaNights), t("nightsAwake")));
  out.push(plain(fmt(life.questions), t("questions")));

  const left = life.shouldDo.map((d) => d.name);
  out.push(node("acct/left", "list", {
    when: String(left.length), what: left.length ? t("meaningTo") : t("nothingLeft"),
    cls: left.length ? "ev loss" : "ev kept", items: left, leaf: !left.length,
  }));

  if (life.motherDied !== undefined) {
    out.push(plain(String(life.motherDied), t("leftTheList"), "quiet"));
  }
  if (life.worldEvents.length) {
    out.push(node("acct/world", "held", {
      when: String(life.worldEvents.length), what: t("outside"), cls: "ev world",
      leaf: false,
      kids: life.worldEvents.map((e, i) => node("acct/world/" + i, "goto", {
        when: e.age + " " + MONTHS[e.month], what: e.text, cls: "ev world",
        age: e.age, leaf: false, notable: true,
      })),
    }));
  }
  return out;
}

// ------------------------------------------------------------------ drawing

// the one rule, applied at every scale: if there are few enough, show them
// all; otherwise show the ones something happened in, and count the rest
function shown(n) {
  const kids = n.kids || childrenOf(n);
  if (n.kind === "year" || kids.length <= CAP || state.more.has(n.id)) return kids;
  const worth = kids.filter((k) => k.notable);
  // if nothing happened in any of them there is nothing to fold away, and a
  // stretch in which nothing happened is still the thing you asked for
  if (!worth.length || worth.length === kids.length) return kids;
  return worth.concat([node(n.id + "/+", "more", {
    what: t("more").replace("%", fmt(kids.length - worth.length)), cls: "more",
    leaf: true, of: n.id,
  })]);
}

function row(n, depth, open) {
  const cls = "node " + (n.cls || "") + (open ? " open" : "") + (n.leaf ? " leaf" : "");
  return '<button class="' + cls + '" style="--d:' + depth + '" data-id="' +
    esc(n.id) + '" type="button">' +
    '<span class="mark">' + (n.leaf ? "" : open ? "▾" : "▸") + "</span>" +
    '<span class="when">' + esc(n.when || "") + "</span>" +
    '<span class="what">' + esc(n.what || "") + "</span>" +
    '<span class="tail">' + esc(n.tail || "") + "</span></button>";
}

function emit(out, nodes, depth) {
  for (const n of nodes) {
    state.nodes.set(n.id, n);
    const open = !n.leaf && state.open.has(n.id);
    out.push(row(n, depth, open));
    if (open) emit(out, shown(n), depth + 1);
  }
}

function draw() {
  const out = [];
  state.nodes = new Map();
  emit(out, roots(), 0);
  $("#tree").innerHTML = out.join("");
}

function clicked(id) {
  const n = state.nodes.get(id);
  if (!n) return;
  if (n.kind === "more") { state.more.add(n.of); draw(); return; }
  if (n.leaf) return;
  if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
  draw();
}

// ------------------------------------------------------------------ the knobs

function segment(key, count) {
  const box = document.createElement("div");
  box.className = "seg";
  box.setAttribute("role", "group");
  for (let i = 0; i < count; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t(key + "Set")[i];
    b.setAttribute("aria-pressed", String(i === state.set[key]));
    b.addEventListener("click", function () {
      state.set[key] = i;
      for (const other of box.children) {
        other.setAttribute("aria-pressed", String(other === b));
      }
    });
    box.appendChild(b);
  }
  return box;
}

function buildKnobs() {
  const knobs = $("#knobs");
  knobs.innerHTML = "";
  const make = (title, why, body) => {
    const k = document.createElement("div");
    k.className = "knob";
    const h = document.createElement("h3"); h.textContent = title;
    const p = document.createElement("p"); p.className = "why"; p.textContent = why;
    k.append(h, p, body);
    knobs.appendChild(k);
  };
  for (const [key, count] of [["century", 4], ["conscience", 4],
                              ["temptation", 4], ["sleep", 3]]) {
    make(t(key), t(key + "Why"), segment(key, count));
  }

  const seedbox = document.createElement("div");
  seedbox.className = "seg";
  const input = document.createElement("input");
  input.type = "number"; input.inputMode = "numeric"; input.value = state.seed;
  input.setAttribute("aria-label", t("seed"));
  input.addEventListener("input", function () {
    state.seed = Number(input.value) || 0;
  });
  const roll = document.createElement("button");
  roll.type = "button"; roll.className = "ghost"; roll.textContent = t("roll");
  roll.addEventListener("click", function () {
    state.seed = Math.floor(Math.random() * 1e6); input.value = state.seed;
  });
  seedbox.append(input, roll);
  make(t("seed"), t("seedWhy"), seedbox);
}

// ------------------------------------------------------------------ running

function run() {
  const century = PRESETS.century[state.set.century];
  state.life = new Life({
    seed: state.seed,
    turbulence: century.turbulence, lethality: century.lethality,
    conscience: PRESETS.conscience[state.set.conscience],
    temptation: PRESETS.temptation[state.set.temptation],
    sleepBase: PRESETS.sleep[state.set.sleep],
    allotted: 0,
  });
  let guard = 0;
  while (state.life.alive && guard++ < 130) state.life.stepYear();
  state.years = indexLife(state.life);
  state.open = new Set(["life"]);
  state.more = new Set();
  chrome();
  draw();
}

function chrome() {
  document.documentElement.lang = state.lang;
  $("#lang").textContent = t("lang");
  $("#blurb").textContent = t("blurb");
  $("#hint").textContent = t("hint");
  $("#run").textContent = state.life ? t("again") : t("run");
  $("#seedout").textContent = state.life ? t("seed") + " " + state.seed : "";
}

function init() {
  chrome();
  buildKnobs();
  draw();
  $("#tree").addEventListener("click", function (e) {
    const b = e.target.closest ? e.target.closest(".node") : null;
    if (b) clicked(b.dataset.id);
  });
  $("#run").addEventListener("click", run);
  $("#lang").addEventListener("click", function () {
    state.lang = state.lang === "hr" ? "en" : "hr";
    chrome(); buildKnobs(); draw();
  });
}

init();
</script>
