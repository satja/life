<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Život — a life</title>
<style>/*CSS*/</style>

<div class="wrap">
  <header class="mast">
    <h1 id="title">Život</h1>
    <span class="sub" id="sub"></span>
    <span class="right">
      <span class="lab" id="seedout"></span>
      <button class="ghost" id="lang" type="button">english</button>
    </span>
  </header>

  <section id="setup">
    <p class="intro" id="intro"></p>
    <div class="knobs" id="knobs"></div>
    <div class="begin">
      <button class="go" id="start" type="button">Proživi jedan</button>
    </div>
  </section>

  <section id="run" hidden>

    <h2 class="act"><span id="h-given"></span></h2>
    <div class="panel given">
      <div class="tree" id="tree"></div>
      <div class="inherit" id="inherit"></div>
      <p class="allot" id="allot"></p>
      <p class="note" id="blamenote"></p>
    </div>

    <h2 class="act">
      <span id="h-life"></span>
      <button class="ghost small" id="replay" type="button"></button>
    </h2>
    <div class="panel">
      <div class="years" id="years"></div>
      <p class="note lab" id="gridnote"></p>
      <div class="yearcard" id="yearcard"></div>
    </div>

    <h2 class="act"><span id="h-account"></span></h2>
    <div class="panel account" id="account"></div>

    <div class="begin end">
      <button class="go" id="again" type="button">Još jedan</button>
    </div>
  </section>
</div>

<script>/*LANG*/</script>
<script>/*ENGINE*/</script>
<script>/*APP*/</script>
