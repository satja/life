<meta name="viewport" content="width=device-width, initial-scale=1">
<title>life.py</title>
<style>/*CSS*/</style>

<div class="wrap">
  <header>
    <h1>life.py</h1>
    <button class="ghost" id="lang" type="button">hrvatski</button>
  </header>

  <p class="blurb" id="blurb"></p>

  <h2 id="h-entry"></h2>
  <pre class="listing" id="main"></pre>
  <p class="foot" id="entrynote"></p>

  <div class="controls">
    <button class="go" id="run" type="button"></button>
    <span class="field">
      <label class="lab" for="seed" id="l-seed"></label>
      <input id="seed" type="number" inputmode="numeric">
      <button class="ghost" id="roll" type="button"></button>
    </span>
  </div>

  <div id="out" hidden>
    <h2>
      <span id="h-stage"></span>
      <span class="right">
        <button class="ghost" id="walk" type="button"></button>
        <span class="field">
          <label class="lab" for="walkage" id="l-atage"></label>
          <input id="walkage" type="number" inputmode="numeric" value="34">
        </span>
      </span>
    </h2>
    <pre class="listing live" id="live"></pre>
    <p class="foot" id="stagenote"></p>

    <h2 id="h-account"></h2>
    <pre class="account" id="account"></pre>

    <p class="foot" id="hint"></p>
  </div>
</div>

<script>/*LANG*/</script>
<script>/*SOURCE*/</script>
<script>/*ENGINE*/</script>
<script>/*APP*/</script>
