<style>:root {

  --panel:   #FBFCFB;
  --grid:    #DCE3E0;
  --rule:    #C6D0CC;
  --ink:     #16211F;
  --muted:   #5F6E6A;
  --faint:   #8A9995;
  --trace:   #1D6F6A;
  --trace-d: #12514D;
  --world:   #A86E14;
  --loss:    #96454F;
  --shadow:  0 1px 0 rgba(22,33,31,.05), 0 8px 24px -18px rgba(22,33,31,.5);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Source Serif 4", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F1517; --panel: #151C1F; --grid: #1B2529; --rule: #26343A;
    --ink: #E7EDEA; --muted: #93A29E; --faint: #6B7A77;
    --trace: #4FB3A8; --trace-d: #7FD3C8; --world: #D9A244; --loss: #D2757F;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1517; --panel: #151C1F; --grid: #1B2529; --rule: #26343A;
  --ink: #E7EDEA; --muted: #93A29E; --faint: #6B7A77;
  --trace: #4FB3A8; --trace-d: #7FD3C8; --world: #D9A244; --loss: #D2757F;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
}
:root[data-theme="light"] {
  --paper: #F4F6F4; --panel: #FBFCFB; --grid: #DCE3E0; --rule: #C6D0CC;
  --ink: #16211F; --muted: #5F6E6A; --faint: #8A9995;
  --trace: #1D6F6A; --trace-d: #12514D; --world: #A86E14; --loss: #96454F;
  --shadow: 0 1px 0 rgba(22,33,31,.05), 0 8px 24px -18px rgba(22,33,31,.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--serif); font-size: 17px; line-height: 1.5;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 30px 30px, 30px 30px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 70px; }
.lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: .13em;
       text-transform: uppercase; color: var(--faint); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 2px;
         box-shadow: var(--shadow); padding: 18px; margin-bottom: 8px; }

.mast { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
        border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 22px; }
.mast h1 { font-size: 30px; font-weight: 400; margin: 0; letter-spacing: -.01em; }
.mast .sub { color: var(--muted); font-size: 14px; font-style: italic; }
.mast .right { margin-left: auto; display: flex; gap: 12px; align-items: baseline; }

h2.act { font-size: 13px; font-family: var(--mono); font-weight: 400;
         letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
         margin: 30px 0 9px; display: flex; align-items: baseline; gap: 12px; }
h2.act:first-of-type { margin-top: 6px; }

/* ---- setup ---- */
.intro { max-width: 60ch; color: var(--muted); font-size: 16px; margin: 0 0 20px; }
.intro b { color: var(--ink); font-weight: 400; font-style: italic; }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.knob { padding: 14px 15px; display: grid; gap: 8px; }
.knob h3 { margin: 0; font-size: 16px; font-weight: 400; }
.knob .why { color: var(--muted); font-size: 13.5px; margin: 0; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 1px;
       background: var(--rule); border: 1px solid var(--rule); border-radius: 2px;
       overflow: hidden; }
.seg button { font-family: var(--mono); font-size: 11.5px; padding: 8px 6px;
  background: var(--panel); color: var(--muted); border: 0; cursor: pointer;
  letter-spacing: .04em; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--grid); color: var(--ink); }
.begin { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
.begin.end { justify-content: center; margin-top: 30px; }
button.go { font-family: var(--mono); font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; background: var(--ink); color: var(--paper); border: 0;
  padding: 13px 28px; border-radius: 2px; cursor: pointer; }
button.go:hover { background: var(--trace-d); }
button.ghost { font-family: var(--mono); font-size: 12px; background: transparent;
  color: var(--muted); border: 1px solid var(--rule); padding: 6px 11px;
  border-radius: 2px; cursor: pointer; }
button.ghost:hover { color: var(--ink); border-color: var(--ink); }
button.ghost.small { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
                     padding: 4px 9px; }
input.seed { font-family: var(--mono); font-size: 13px; width: 8.5ch; background: var(--paper);
  color: var(--ink); border: 1px solid var(--rule); padding: 6px 8px; border-radius: 2px; }
:focus-visible { outline: 2px solid var(--trace); outline-offset: 2px; }

/* ---- act one: the family ---- */
.given .tree { display: flex; justify-content: center; }
.given svg { max-width: 100%; height: auto; }
.given .node { font-family: var(--mono); font-size: 13px; letter-spacing: .08em;
               text-transform: uppercase; fill: var(--ink); }
.inherit { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
           gap: 2px 22px; margin-top: 14px; }
.inherit .row { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
.inherit .ar { color: var(--faint); margin-left: auto; }
.inherit .wh { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
               text-transform: uppercase; color: var(--trace); }
.given .edge { stroke: var(--rule); fill: none; }
.given .edge.carries { stroke: var(--trace); }
.allot { margin: 14px 0 0; font-size: 19px; font-style: italic; text-wrap: balance; }
.note { color: var(--faint); font-size: 13px; margin: 6px 0 0; max-width: 58ch; }

/* ---- act two: the years ---- */
.years { display: grid; grid-template-columns: 2.4em repeat(10, 1fr); gap: 5px; }
.years .decade { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
                 align-self: center; }
.cell { position: relative; aspect-ratio: 1; border-radius: 1px; border: 0;
        padding: 0; cursor: pointer; background: var(--grid); }
.cell:hover { outline: 2px solid var(--trace); outline-offset: 1px; }
.cell[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.unlived { background: transparent; border: 1px dashed var(--grid); cursor: default; }
.cell.unlived:hover { outline: none; }
.cell .ev { position: absolute; width: 4px; height: 4px; border-radius: 50%; }
.cell .ev.world { top: 2px; right: 2px; background: var(--world); }
.cell .ev.mine { bottom: 2px; right: 2px; background: var(--ink); }
.cell.dying { outline: 2px solid var(--loss); outline-offset: 1px; }
.years.reveal .cell { opacity: 0; }
.years.reveal .cell.shown { opacity: 1; transition: opacity .25s ease; }

.yearcard { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 14px;
            min-height: 132px; }
.yearcard .age { font-family: var(--mono); font-size: 30px; line-height: 1;
                 font-variant-numeric: tabular-nums; }
.yearcard .stage { color: var(--faint); font-family: var(--mono); font-size: 11px;
                   letter-spacing: .12em; text-transform: uppercase; margin-left: 10px; }
.yearcard .mostly { font-size: 18px; margin: 10px 0 0; text-wrap: balance; }
.yearcard .thought { color: var(--muted); font-style: italic; margin: 6px 0 0; }
.yearcard ul { list-style: none; margin: 12px 0 0; padding: 0; }
.yearcard li { padding: 2px 0; display: flex; gap: 10px; align-items: baseline; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .07em;
       text-transform: uppercase; padding: 1px 6px; border-radius: 2px;
       border: 1px solid currentColor; color: var(--faint); white-space: nowrap; }
.tag.world { color: var(--world); }
.tag.loss { color: var(--loss); }
.tag.kept { color: var(--trace); }

/* ---- act three: the account ---- */
.went { display: flex; height: 30px; border-radius: 2px; overflow: hidden;
        margin: 4px 0 14px; border: 1px solid var(--rule); }
.went div { height: 100%; }
.wentkey { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
           gap: 4px 18px; margin-bottom: 20px; }
.wentkey .row { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
.wentkey .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.wentkey .yr { margin-left: auto; font-family: var(--mono); font-size: 12px;
               color: var(--muted); font-variant-numeric: tabular-nums; }
.big { font-size: 21px; font-style: italic; text-wrap: balance; margin: 0 0 4px; }
.figures { display: grid; gap: 7px; margin: 18px 0; }
.fig { display: flex; align-items: baseline; gap: 12px; }
.fig .v { font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums;
          min-width: 5.6em; text-align: right; }
.fig .k { color: var(--muted); font-size: 14.5px; }
.account h3 { font-size: 12px; font-family: var(--mono); font-weight: 400;
              letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
              margin: 22px 0 7px; }
.account ul { list-style: none; margin: 0; padding: 0; }
.account li { padding: 2px 0; display: flex; gap: 10px; align-items: baseline; }
.account li .n { font-family: var(--mono); font-size: 11.5px; color: var(--faint);
                 white-space: nowrap; }
blockquote { margin: 14px 0 0; padding-left: 14px; border-left: 2px solid var(--loss);
             color: var(--muted); font-style: italic; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 560px) {
  body { font-size: 16px; }
  .wrap { padding: 18px 12px 50px; }
  .panel { padding: 14px; }
  .years { grid-template-columns: 2em repeat(10, 1fr); gap: 4px; }
  .yearcard .age { font-size: 25px; }
  .fig .v { font-size: 16px; min-width: 5em; }
}
</style>

<div class="wrap">
  <header class="mast">

    <div class="panel account" id="account"></div>

    <div class="begin end">
      <button class="go" id="again" type="button">Još jedan</button>
    </div>
  </section>
</div>

function say(text, lang) {
  if (lang !== "hr" || text === undefined || text === null) return text;
  if (HR[text]) return HR[text];
  // scars arrive already composed, and so does the one kept promise
  if (text.endsWith(", again")) {
    const base = text.slice(0, -", again".length);
    return (HR[base] || base) + ", opet";
  }
  if (text.startsWith("gets round to it — ")) {
    const base = text.slice("gets round to it — ".length);
    return "stigao je do: " + (HR[base] || base);
  }
  if (text.startsWith("raises it — ")) return text;   // rebuilt in the app
  if (text.startsWith("average mark: ")) {
    return "prosjek: " + text.slice("average mark: ".length);
  }
  return text;
}

function energyAt(age) {
  if (age < 3) return 4;
  if (age < 13) return 6 + ((age / 5) | 0);
  if (age < 20) return 9;
  if (age < 36) return 10;
  if (age < 56) return 9;
  if (age < 66) return 8;
  if (age < 76) return 6;
  if (age < 86) return 4;
  return 3;
}

function frailty(age) {
  if (age < 5) return 1.6;
  if (age < 15) return 0.5;
  if (age < 45) return 0.8;
  if (age < 65) return 1.4;
  if (age < 80) return 2.5;
  return 4.0;
}

// ---------------------------------------------------------------- the life

class Life {
  constructor(opts) {
    this.opts = opts;
    this.rng = mulberry32(opts.seed >>> 0);
    this.names = []; this.nameIndex = new Map();
    this.thoughtNames = []; this.thoughtIndex = new Map();

    this.minute = 6 * 60 + 14;
    this.alive = true;
    this.grogginess = 0; this.eveningLeft = 60; this.idle = 0;
    this.lying = false; this.tempted = false; this.reminded = false;
    this.sleepAttempts = 0; this.insomniaNoted = false;
    this.dayIndex = 0; this.yearSeen = -1; this.monthSeen = -1;
    this.stage = null; this.choices = []; this.skillsKept = [];
    this.holidayFrom = -1; this.holidayTo = -1;
    this.salience = new Map(); this.scars = []; this.circumstances = [];
    this.pending = []; this.noLonger = new Set(); this.preoccupation = null;
    this.cause = null; this.diedAt = null;

    this.canDo = []; this.mustDo = []; this.shouldDo = []; this.neverDo = [];
    this.conscious = []; this.subconscious = []; this.byTheme = new Map();

    this.mornings = 0; this.alarms = 0; this.gotRoundTo = 0;
    this.insomniaNights = 0; this.worstNight = [0, 0, ""];
    this.totalDone = 0; this.totalThoughts = 0;
    this.neverTotal = 0; this.rememberedTotal = 0;
    this.doneCount = new Map(); this.doneMinutes = new Map();
    this.thoughtCount = new Map(); this.themeCount = new Map();
    this.deepCount = 0; this.deepTexts = new Set();

    this.days = [];            // one record per day lived
    this.events = [];          // {age, month, text, kind}
    this.worldEvents = [];
    this.seenEvents = new Set();

    this.inherit();
    this.raiseChildhood();
    this.goToSchool();
    this.timeline = this.unfoldHistory();
    this.schedule = this.buildSchedule();
  }

  rnd() { return this.rng(); }
  rint(n) { return Math.floor(this.rng() * n); }
  rrange(a, b) { return a + Math.floor(this.rng() * (b - a)); }
  pick(list) { return list[Math.floor(this.rng() * list.length)]; }
  gauss() {
    let u = 0, v = 0;
    while (u === 0) u = this.rng();
    while (v === 0) v = this.rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  nameId(s) {
    let i = this.nameIndex.get(s);
    if (i === undefined) { i = this.names.length; this.names.push(s); this.nameIndex.set(s, i); }
    return i;
  }
  thoughtId(s) {
    let i = this.thoughtIndex.get(s);
    if (i === undefined) {
      i = this.thoughtNames.length; this.thoughtNames.push(s); this.thoughtIndex.set(s, i);
    }
    return i;
  }

  get day() { return Math.floor(this.minute / MIN_DAY); }
  get hour() { return Math.floor((this.minute % MIN_DAY) / 60); }
  get age() { return Math.floor(this.day / DAYS_YEAR); }
  get month() { return Math.min(11, Math.floor((this.day % DAYS_YEAR) * 12 / DAYS_YEAR)); }
  clockTime() {
    const r = this.minute % MIN_DAY;
    return String(Math.floor(r / 60)).padStart(2, "0") + ":" + String(r % 60).padStart(2, "0");
  }
  tick(m) { this.minute += (m === undefined ? 1 : m); }

  // genes: multiple inheritance, resolved in the usual order
  inherit() {
    const MRO = [
      ["You", {}],
      ["Mother", { worry: 1, eyes: "green", everything_else: "hers" }],
      ["Father", { posture: "bad", eyes: "grey" }],
      ["Grandmother", { stubbornness: 1, recipe: "never written down" }],
      ["Grandfather", { silence: "long" }],
      ["Ancestor", { hope: 1, fear_of_the_dark: 1, eyes: "brown" }],
    ];
    const traits = ["hope","fear_of_the_dark","stubbornness","worry","posture","silence",
                    "recipe","eyes","patience","a way with people"];
    this.given = {}; this.fromWhom = {};
    for (const trait of traits) {
      const dominant = this.rint(3) > 0;
      if (!dominant && this.rint(2) !== 0) continue;
      for (let i = 0; i < MRO.length; i++) {
        if (trait in MRO[i][1]) { this.given[trait] = true; break; }
      }
      if (!(trait in this.given)) continue;
      for (let i = MRO.length - 1; i >= 0; i--) {
        if (trait in MRO[i][1]) { this.fromWhom[trait] = MRO[i][0]; break; }
      }
    }
    let span = this.opts.allotted;
    if (!span) {
      span = 68 + this.rrange(-11, 22);
      if (this.given.stubbornness) span += 4;
      if (this.given.worry) span -= 2;
    }
    this.lifespan = span;
  }

  // upbringing: what gets appended, and when it comes back out
  raiseChildhood() {
    this.unresolved = []; this.raised = null;
    for (let age = 0; age < 7; age++) {
      if (this.rint(3) > 0) continue;
      const hurt = this.pick(SMALL_THINGS);
      if (this.rint(3) === 0) this.unresolved.push(hurt);
    }
    let age = 17;
    while (this.unresolved.length > 0) {
      const thing = this.unresolved.pop();
      age += 1;
      if (age > 79) return;
      if (this.rint(10) > 0) this.unresolved.unshift(thing);
      else { this.raised = [age, thing]; return; }
    }
  }

  // education: understanding does not terminate, the bell does
  goToSchool() {
    const subjects = Object.keys(SUBJECTS);
    this.curiousAbout = [this.pick(subjects), this.pick(subjects)];
    this.questions = 0; this.notUnderstood = new Set(); this.skills = [];
    let grades = 0, taken = 0;
    const understand = (subject) => {
      if (!this.curiousAbout.includes(subject)) { this.notUnderstood.add(subject); return; }
      let open = 1, guard = 0;
      while (open > 0 && guard++ < 4000) {
        if (this.rint(45) === 0) break;
        open += this.rrange(2, 4) - 1;
      }
      this.questions += open;
    };
    for (let year = 0; year < 12; year++) {
      for (let k = 0; k < 3; k++) {
        const subject = this.pick(subjects);
        const facts = SUBJECTS[subject];
        let right = 0;
        for (let f = 0; f < facts; f++) if (this.rint(3) === 0) right++;
        grades += Math.round(1 + 4 * right / facts); taken++;
      }
      if (this.rint(3) === 0) understand(this.pick(subjects));
      if (this.rint(4) === 0) understand(this.pick(this.curiousAbout));
    }
    this.average = taken ? grades / taken : 0;
    for (const skill of WORTH_KEEPING) if (this.rint(3) > 0) this.skills.push(skill);
  }

  unfoldHistory() {
    const out = [], spent = new Set();
    const rate = this.opts.turbulence;
    let age = 2;
    while (age < 101) {
      if (this.rnd() < rate) {
        const candidates = WORLD.filter((e) => e.rep || !spent.has(e.t));
        if (!candidates.length) break;
        let total = 0;
        for (const e of candidates) total += e.w;
        let cut = this.rnd() * total, chosen = candidates[candidates.length - 1];
        for (const e of candidates) { cut -= e.w; if (cut <= 0) { chosen = e; break; } }
        out.push([age, chosen]);
        spent.add(chosen.t);
        age += Math.max(1, chosen.years);
      } else age += 1;
    }
    return out;
  }

  buildSchedule() {
    const plan = new Map();
    const add = (age, text, effect) => {
      if (!plan.has(age)) plan.set(age, []);
      plan.get(age).push([text, effect || null]);
    };
    add(1, "says a word, on purpose");
    add(6, "starts school");
    add(18, "leaves school with a certificate stating that you can be taught");
    add(18, "average mark: " + this.average.toFixed(1));
    add(this.rrange(15, 20), "falls in love, silently");
    add(this.rrange(19, 26), "first job");
    add(this.rrange(20, 29), "moves out for good");
    if (this.rint(3) > 0) add(this.rrange(26, 39), "becomes a parent, and promises not to", "parent");
    if (this.rint(2) === 0) add(this.rrange(30, 55), "stops speaking to someone");
    const buriesFather = this.rrange(37, 72);
    add(buriesFather, "your father dies", "father");
    add(Math.min(96, buriesFather + this.rrange(0, 15)), "your mother dies", "mother");
    add(66, "stops going to work");
    if (this.raised) add(this.raised[0],
      "raises it — " + this.raised[1] + " — at someone who was not there");
    return plan;
  }

  // ------------------------------------------------------------ the machinery

  refreshMind() {
    const age = this.age;
    let thoughts = THOUGHTS[stageAt(age)].slice();
    for (const c of this.circumstances) if (c.thinks) thoughts = thoughts.concat(c.thinks);
    if (!this.preoccupation || this.preoccupation[1] <= age) {
      this.preoccupation = [this.pick(thoughts), age + this.rrange(2, 8), age];
    }
    thoughts = thoughts.concat([this.preoccupation[0], this.preoccupation[0], this.preoccupation[0]]);
    this.conscious = thoughts.map((t) => ({ text: t[0], theme: t[1], deep: false }));
    this.subconscious = DEEP.filter((d) => age >= d[2])
      .map((d) => ({ text: d[0], theme: d[1], deep: true })).concat(this.scars);
    this.neverDo = age >= 13
      ? NEVER_DO.map((n) => ({ name: n, kind: 3, minutes: this.rrange(5, 40) })) : [];
    this.byTheme = new Map();
    for (const t of this.conscious.concat(this.subconscious)) {
      if (!this.byTheme.has(t.theme)) this.byTheme.set(t.theme, []);
      this.byTheme.get(t.theme).push(t);
    }
  }

  remember(text, theme) {
    if (this.scars.length >= 8) return;
    if (this.scars.some((s) => s.text === text)) return;
    const t = { text, theme, deep: true };
    this.scars.push(t); this.subconscious.push(t);
    if (!this.byTheme.has(theme)) this.byTheme.set(theme, []);
    this.byTheme.get(theme).push(t);
  }

  restock() {
    let choices = CAN_DO[this.stage].slice();
    for (const s of this.skillsKept) choices.push([s, 45]);
    for (const c of this.circumstances) if (c.does) choices = choices.concat(c.does);
    choices = choices.concat(SEASON[SEASONS[this.month]]);
    const already = new Set(), distinct = [];
    for (const [name, minutes] of choices) {
      if (!already.has(name)) { already.add(name); distinct.push([name, minutes]); }
    }
    this.choices = distinct;
  }

  drift() {
    for (const [name] of this.choices) {
      if (!this.salience.has(name)) this.salience.set(name, BASE[name] || 1.0);
    }
    for (const [name, value] of this.salience) {
      const anchor = Math.log(BASE[name] || 1.0);
      const moved = anchor + 0.96 * (Math.log(value) - anchor) + this.gauss() * 0.14;
      this.salience.set(name, Math.min(4.0, Math.max(0.15, Math.exp(moved))));
    }
  }

  weightedPick(choices, wanted) {
    const scored = [];
    for (let i = 0; i < choices.length; i++) {
      const [name, minutes] = choices[i];
      const w = this.salience.get(name) || 1.0;
      scored.push([Math.pow(this.rnd(), 1.0 / w), name, minutes]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    return scored.slice(0, wanted).map((s) => [s[1], s[2]]);
  }

  note(text, kind) {
    if (this.seenEvents.has(text)) return;
    this.seenEvents.add(text);
    this.events.push({ age: this.age, month: this.month, day: this.day, text, kind });
  }

  takePlace(event) {
    const age = this.age, month = this.rint(12);
    this.circumstances.push({
      text: event.t, until: age + event.years, risk: (event.risk || 0) * this.opts.lethality,
      does: event.does || [], thinks: event.thinks || [],
    });
    this.worldEvents.push({ age, month, text: event.t, kind: event.kind });
    this.events.push({ age, month, day: this.day, text: event.t, kind: "world" });
    if (event.costs) this.owe(event.costs);
  }

  owe(name) {
    if (this.noLonger.has(name)) return;
    if (this.shouldDo.some((d) => d.name === name)) return;
    this.shouldDo.push({ name, kind: 2, minutes: this.rrange(20, 120) });
  }

  takeEffect(key) {
    const age = this.age;
    if (key === "parent") {
      this.circumstances.push({
        text: "a child", until: age + 18, risk: 0,
        does: [["carrying someone who is asleep", 60], ["reading the same book aloud", 30],
               ["worrying about someone else", 45]],
        thinks: [["whether they are all right", "love"]],
      });
    } else if (key === "father") {
      this.remember("the silence at the table", "death");
    } else if (key === "mother") {
      this.remember("the hallway, empty", "death");
      this.noLonger.add("call your mother");
      this.shouldDo = this.shouldDo.filter((d) => d.name !== "call your mother");
      this.motherDied = age;
    }
  }

  die(cause) {
    this.alive = false;
    this.diedAt = [this.age, this.clockTime()];
    this.cause = cause;
    this.pending = [];
    this.events.push({ age: this.age, month: this.month, day: this.day,
                       text: "does not get up", kind: "end" });
    this.canDo = [];
  }

  birthday(age) {
    this.circumstances = this.circumstances.filter((c) => c.until > age);
    for (const [start, event] of this.timeline) if (start === age) this.takePlace(event);
    if (age > this.lifespan) { this.die(null); return; }
    for (const c of this.circumstances) {
      const chance = c.risk * frailty(age);
      if (chance && this.rnd() < chance) { this.die(c.text); return; }
    }
    this.pending = (this.schedule.get(age) || []).map((e) => [this.rint(12), e[0], e[1]]);
    this.schedule.delete(age);
    this.offerSomething(age);
    this.stage = stageAt(age);
    const keeping = (52 - age) / 32.0;
    this.skillsKept = this.skills.filter(() => age >= 20 && age < 52 && this.rnd() < keeping);
    this.monthSeen = -1;
    if (age >= 5 && age < 66) {
      this.holidayFrom = this.rrange(176, 232);
      this.holidayTo = this.holidayFrom + this.rrange(12, 25);
    } else { this.holidayFrom = this.holidayTo = -1; }
    this.refreshMind();
  }

  offerSomething(age) {
    if (age < 5 || this.rint(4) > 0) return;
    if (this.shouldDo.length >= 9) return;
    const onList = this.shouldDo.map((d) => d.name);
    const left = SHOULD_DO.filter((s) => !onList.includes(s) && !this.noLonger.has(s));
    if (left.length) this.owe(this.pick(left));
  }

  firePending() {
    const later = [];
    for (const [month, text, effect] of this.pending) {
      if (month !== this.month) { later.push([month, text, effect]); continue; }
      this.note(text, effect === "father" || effect === "mother" ? "loss" : "milestone");
      if (effect) this.takeEffect(effect);
    }
    this.pending = later;
  }

  newMonth() { this.monthSeen = this.month; this.firePending(); this.restock(); this.drift(); }

  morningOf(full) {
    this.mornings++;
    this.dayIndex = this.day;
    this.sleepAttempts = 0; this.insomniaNoted = false; this.lying = false;
    this.eveningLeft = this.rrange(30, 150);
    const age = this.age;
    if (age !== this.yearSeen) { this.yearSeen = age; this.birthday(age); }
    if (!this.alive) { this.canDo = []; return; }
    if (this.month !== this.monthSeen) this.newMonth();
    const energy = energyAt(age) - (full ? 0 : 1);
    const doy = this.day % DAYS_YEAR;
    const away = doy >= this.holidayFrom && doy < this.holidayTo;
    let pool = this.choices;
    if (away) {
      pool = pool.filter((c) => !WORK.has(c[0]) && !TERM_ONLY.has(c[0])).concat(HOLIDAY);
    } else if (age < 20 && doy >= 172 && doy < 244) {
      pool = pool.filter((c) => !TERM_ONLY.has(c[0]));
    }
    this.canDo = this.weightedPick(pool, Math.max(1, energy)).map(
      ([name, minutes]) => ({ name, kind: 0, minutes }));
    if (!away && this.mustDo.length < 9 && this.rint(2) === 0) {
      let owed = MUST_DO[this.stage];
      if (doy >= 172 && doy < 244) owed = owed.filter((o) => !SCHOOL.has(o));
      if (owed.length) {
        this.mustDo.push({ name: this.pick(owed), kind: 1, minutes: this.rrange(20, 90) });
      }
    }
    this.tempted = this.rint(this.opts.temptation) === 0;
    this.reminded = false;
  }

  doThing(thing) {
    this.tick(thing.minutes);
    this.record.acts.push(thing.kind, this.nameId(thing.name), thing.minutes);
    this.record.busy += thing.minutes;
    this.totalDone++;
    this.doneCount.set(thing.name, (this.doneCount.get(thing.name) || 0) + 1);
    this.doneMinutes.set(thing.name,
      (this.doneMinutes.get(thing.name) || 0) + thing.minutes);
    if (thing.kind === 3) {
      this.record.never++; this.neverTotal++;
      if (this.rint(9) === 0) {
        this.remember(thing.name + ", again", REGRET[thing.name] || "shame");
      }
    } else {
      if (thing.kind === 2) {
        this.reminded = false; this.gotRoundTo++; this.record.should++;
        this.events.push({ age: this.age, month: this.month, day: this.day,
                           text: "gets round to it — " + thing.name, kind: "kept" });
      }
      for (const pool of [this.canDo, this.mustDo, this.shouldDo]) {
        const at = pool.indexOf(thing);
        if (at >= 0) { pool.splice(at, 1); break; }
      }
    }
    this.idle += this.rint(3);
    this.tempted = this.rint(this.opts.temptation) === 0;
    if (!this.reminded && this.rnd() < this.opts.conscience) {
      this.reminded = true; this.record.remembered++; this.rememberedTotal++;
    }
  }

  think(thought) {
    this.tick(this.rrange(1, 4));
    this.idle--;
    this.totalThoughts++;
    this.record.thoughts.push(this.thoughtId(thought.text));
    this.thoughtCount.set(thought.text, (this.thoughtCount.get(thought.text) || 0) + 1);
    this.themeCount.set(thought.theme, (this.themeCount.get(thought.theme) || 0) + 1);
    if (thought.deep) { this.deepCount++; this.deepTexts.add(thought.text); }
  }

  related(thought) { return this.byTheme.get(thought.theme) || this.conscious; }

  thinkAboutStuff() {
    const all = this.subconscious.concat(this.conscious);
    if (!all.length) return;
    let thought = this.pick(all);
    let guard = 0;
    while (this.idle > 0 && guard++ < 400) {
      this.think(thought);
      thought = this.rint(10) > 0 ? this.pick(this.related(thought)) : this.pick(all);
    }
  }

  // live.py, faithfully: a condition costs a minute to check
  stillSleepy() { this.tick(); if (this.grogginess <= 0) return false; this.grogginess--; return true; }
  mustWakeUp() {
    this.tick();
    const age = this.age;
    if (age < 6 || age >= 66 || !this.alive) return false;
    const d = this.day % 7;
    return d !== 5 && d !== 6;
  }
  lyingDown() {
    this.tick();
    if (this.lying) return true;
    this.eveningLeft--;
    if (this.eveningLeft <= 0) { this.lying = true; this.idle += this.rrange(2, 9); return true; }
    return false;
  }
  isMorning() {
    this.tick();
    if (this.hour >= 3 && this.hour < 7) {
      if (!this.insomniaNoted) { this.insomniaNoted = true; this.insomniaNights++; }
      return true;
    }
    return false;
  }

  getUp() { this.grogginess = 0; this.morningOf(true); }
  doWhateverItTakes() {
    this.tick(this.rrange(5, 25)); this.grogginess = 0; this.alarms++;
    this.record.alarm = true; this.morningOf(false);
  }

  fallAsleep() {
    if (!this.alive) { this.night(); return true; }
    this.tick(this.rrange(1, 5));
    this.sleepAttempts++;
    this.idle += this.rint(2);
    const chance = this.opts.sleepBase + 0.012 * this.sleepAttempts;
    if (this.rnd() < chance) { this.night(); return true; }
    return false;
  }

  night() {
    if (this.insomniaNoted && this.sleepAttempts > this.worstNight[0]) {
      this.worstNight = [this.sleepAttempts, this.age, this.clockTime()];
    }
    this.record.attempts = this.sleepAttempts;
    this.record.asleep = this.minute % MIN_DAY;
    this.record.insomnia = this.insomniaNoted;
    const wake = 6 * 60 + this.rint(150);
    const target = (this.dayIndex + 1) * MIN_DAY + wake;
    this.minute = Math.max(target, this.minute + 45);
    this.grogginess = this.rint(45);
    this.lying = false;
  }

  wakeUp() {
    let guard = 0;
    while (this.stillSleepy() && guard++ < 600) {
      if (this.mustWakeUp()) { this.doWhateverItTakes(); return; }
    }
    this.getUp();
  }

  liveADay() {
    let guard = 0;
    while (this.canDo.length > 0 && guard++ < 200) {
      this.thinkAboutStuff();
      if (this.mustDo.length > 0 && this.rint(2) === 0) this.doThing(this.pick(this.mustDo));
      if (this.reminded && this.shouldDo.length > 0 && this.rint(3) === 0) {
        this.doThing(this.pick(this.shouldDo));
      }
      if (this.tempted && this.neverDo.length > 0 && this.rint(4) === 0) {
        this.doThing(this.pick(this.neverDo));
      }
      if (!this.canDo.length) break;
      this.doThing(this.pick(this.canDo));
      this.thinkAboutStuff();
    }
  }

  sleepNow() {
    let guard = 0;
    while (!this.lyingDown() && guard++ < 400) { /* waiting to be able to */ }
    let attempts = 0;
    guard = 0;
    while (this.fallAsleep() === false && guard++ < 300) {
      this.thinkAboutStuff();
      attempts++;
      if (attempts === 50) this.tick(this.rrange(2, 10));
      if (attempts > 50) this.tick(1);
      this.isMorning();
    }
  }

  // one full day, recorded
  step() {
    if (!this.alive) return false;
    this.record = { age: 0, month: 0, wake: 0, busy: 0, acts: [], thoughts: [],
                    attempts: 0, asleep: 0, insomnia: false, never: 0, should: 0,
                    remembered: 0, alarm: false };
    const startedAt = this.minute;
    this.wakeUp();
    this.record.age = this.age; this.record.month = this.month;
    this.record.wake = startedAt % MIN_DAY;
    this.record.dayOfLife = this.dayIndex;
    if (this.alive) { this.liveADay(); this.sleepNow(); }
    else { this.record.asleep = this.minute % MIN_DAY; }
    this.days.push(this.record);
    return true;
  }

  stepYear() {
    const target = this.age + 1;
    let guard = 0;
    while (this.alive && this.age < target && guard++ < 500) this.step();
    if (!this.alive && this.days.length && !this.finished) this.finished = true;
    return this.alive;
  }
}

</script>
<script>const $ = (s, r) => (r || document).querySelector(s);

const PRESETS = {
  century: {
    en: ["quiet", "ordinary", "turbulent", "catastrophic"],
    hr: ["mirno", "obično", "burno", "katastrofalno"],
    val: [{ turbulence: .030, lethality: .4 }, { turbulence: .075, lethality: 1 },
          { turbulence: .130, lethality: 1.8 }, { turbulence: .200, lethality: 3 }],
  },
  conscience: {
    en: ["rarely", "sometimes", "often", "constantly"],
    hr: ["rijetko", "ponekad", "često", "stalno"],
    val: [1 / 60000, 1 / 26000, 1 / 8000, 1 / 1500],
  },
};

const state = {
  life: null, lang: (navigator.language || "en").startsWith("hr") ? "hr" : "en",
  century: 1, conscience: 1, seed: Math.floor(Math.random() * 1e6), year: null,
};

const t = (k) => UI[state.lang][k];
const w = (s) => say(s, state.lang);
const num = (n) => n.toLocaleString(state.lang === "hr" ? "hr-HR" : "en-US");
const months = () => (state.lang === "hr" ? MONTHS_HR : MONTHS);

function spanOf(minutes) {
  const hours = minutes / 60;
  if (hours >= 8760) {
    const y = hours / 8760;
    const s = y.toFixed(1);
    return (state.lang === "hr" ? s.replace(".", ",") + " god." : s + " years");
  }
  if (hours >= 48) {
    return Math.round(hours / 24) + (state.lang === "hr" ? " dana" : " days");
  }
  return Math.round(hours) + (state.lang === "hr" ? " h" : " h");
}

// ------------------------------------------------------------------ setup

function buildSetup() {
  const knobs = $("#knobs");
  knobs.innerHTML = "";
  const make = (title, why, node) => {
    const k = document.createElement("div");
    k.className = "knob panel";
    k.innerHTML = "<h3>" + title + '</h3><p class="why">' + why + "</p>";
    k.appendChild(node);
    knobs.appendChild(k);
  };
  const seg = (key, chosen, onPick) => {
    const box = document.createElement("div");
    box.className = "seg"; box.setAttribute("role", "group");
    PRESETS[key][state.lang].forEach((label, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.setAttribute("aria-pressed", String(i === chosen()));
      b.addEventListener("click", () => {
        onPick(i);
        for (const other of box.children) {
          other.setAttribute("aria-pressed", String(other === b));
        }
      });
      box.appendChild(b);
    });
    return box;
  };

  make(t("century"), t("centuryWhy"),
       seg("century", () => state.century, (i) => (state.century = i)));
  make(t("conscience"), t("conscienceWhy"),
       seg("conscience", () => state.conscience, (i) => (state.conscience = i)));

  const wrap = document.createElement("div");
  wrap.className = "begin"; wrap.style.marginTop = "0";
  const input = document.createElement("input");
  input.className = "seed"; input.type = "number"; input.value = state.seed;
  input.setAttribute("aria-label", t("seed"));
  input.addEventListener("input", () => (state.seed = Number(input.value) || 0));
  const roll = document.createElement("button");
  roll.className = "ghost"; roll.type = "button"; roll.textContent = t("roll");
  roll.addEventListener("click", () => {
    state.seed = Math.floor(Math.random() * 1e6); input.value = state.seed;
  });
  wrap.append(input, roll);
  make(t("seed"), t("seedWhy"), wrap);
}

function chrome() {
  $("#title").textContent = t("title");
  $("#sub").textContent = t("sub");
  $("#intro").innerHTML = t("intro");
  $("#start").textContent = t("begin");
  $("#again").textContent = t("again");
  $("#lang").textContent = t("lang");
  $("#h-given").textContent = t("given");
  $("#h-life").textContent = t("theLife");
  $("#h-account").textContent = t("account");
  $("#replay").textContent = t("replay");
  $("#gridnote").textContent = t("gridNote");
  document.documentElement.lang = state.lang;
}

// ------------------------------------------------------------------ living

function live() {
  const c = PRESETS.century.val[state.century];
  state.life = new Life({
    seed: state.seed, turbulence: c.turbulence, lethality: c.lethality,
    conscience: PRESETS.conscience.val[state.conscience],
    temptation: 12, sleepBase: .05, allotted: 0,
  });
  let guard = 0;
  while (state.life.alive && guard++ < 130) state.life.stepYear();
  state.year = null;
  $("#setup").hidden = true;
  $("#run").hidden = false;
  $("#seedout").textContent = (state.lang === "hr" ? "sjeme " : "seed ") + state.seed;
  drawAll();
}

function drawAll() { drawTree(); drawYears(); drawYearCard(); drawAccount(); }

// ---- act one: the family, drawn in the order Python resolves it -----------

function drawTree() {
  const life = state.life;
  const W = 520, H = 176;
  const at = {
    Ancestor: [260, 22], Grandmother: [110, 74], Grandfather: [410, 74],
    Mother: [150, 128], Father: [370, 128], You: [260, 168],
  };
  const edges = [
    ["Grandmother", "Ancestor"], ["Grandfather", "Ancestor"],
    ["Mother", "Grandmother"], ["Mother", "Grandfather"],
    ["Father", "Grandmother"], ["Father", "Grandfather"],
    ["You", "Mother"], ["You", "Father"],
  ];
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    t("given") + '">';
  for (const [a, b] of edges) {
    const [x1, y1] = at[a], [x2, y2] = at[b];
    svg += '<path class="edge" d="M' + x1 + " " + (y1 - 11) + "C" + x1 + " " +
      (y1 - 30) + " " + x2 + " " + (y2 + 22) + " " + x2 + " " + (y2 + 6) + '"/>';
  }
  for (const [who, [x, y]] of Object.entries(at)) {
    svg += '<text class="node" x="' + x + '" y="' + y + '" text-anchor="middle">' +
      w(who) + "</text>";
  }
  svg += "</svg>";
  $("#tree").innerHTML = svg;

  // the traits read as a list, which stays legible at any width and never
  // collides with the drawing
  const rows = Object.entries(life.fromWhom)
    .map(([trait, who]) => '<div class="row"><span class="tr">' + w(trait) +
      '</span><span class="ar">←</span><span class="wh">' + w(who) + "</span></div>");
  $("#inherit").innerHTML = rows.join("");
  $("#allot").textContent = life.lifespan + " " + t("allotted");
  $("#blamenote").textContent = t("blameNote");
}

// ---- act two: a square a year -------------------------------------------

function yearsOf(age) {
  const life = state.life;
  const from = age * 365, to = Math.min(life.days.length, (age + 1) * 365);
  return from >= life.days.length ? [] : life.days.slice(from, to);
}

function tallyYear(age) {
  const life = state.life, done = new Map(), thoughts = new Map();
  let busy = 0, tries = 0, worstNight = 0;
  for (const r of yearsOf(age)) {
    for (let i = 0; i < r.acts.length; i += 3) {
      const name = life.names[r.acts[i + 1]];
      done.set(name, (done.get(name) || 0) + r.acts[i + 2]);
    }
    for (const id of r.thoughts) {
      const text = life.thoughtNames[id];
      thoughts.set(text, (thoughts.get(text) || 0) + 1);
    }
    busy += r.busy; tries += r.attempts;
    if (r.attempts > worstNight) worstNight = r.attempts;
  }
  return { done, thoughts, busy, tries, worstNight, days: yearsOf(age).length };
}

function drawYears() {
  const life = state.life, box = $("#years");
  box.innerHTML = "";
  const lived = Math.floor((life.days.length - 1) / 365);
  const span = Math.max(lived, life.lifespan);
  const fullness = [];
  for (let a = 0; a <= span; a++) {
    const days = yearsOf(a);
    fullness.push(days.length ? days.reduce((s, r) => s + r.busy, 0) / days.length : 0);
  }
  const peak = Math.max(1, ...fullness);
  const evented = new Set(life.events.filter((e) => e.kind !== "world").map((e) => e.age));
  const worldly = new Set(life.worldEvents.map((e) => e.age));

  for (let a = 0; a <= span; a++) {
    if (a % 10 === 0) {
      const d = document.createElement("div");
      d.className = "decade"; d.textContent = a;
      box.appendChild(d);
    }
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cell" + (fullness[a] ? "" : " unlived");
    cell.setAttribute("aria-label", String(a));
    if (fullness[a]) {
      const k = .18 + .82 * (fullness[a] / peak);
      cell.style.background = "color-mix(in srgb, var(--trace) " +
        Math.round(k * 100) + "%, transparent)";
      cell.addEventListener("click", () => { state.year = a; drawYears(); drawYearCard(); });
    } else {
      cell.disabled = true;
    }
    if (worldly.has(a)) cell.innerHTML += '<span class="ev world"></span>';
    if (evented.has(a)) cell.innerHTML += '<span class="ev mine"></span>';
    if (life.diedAt && a === life.diedAt[0]) cell.classList.add("dying");
    if (state.year === a) cell.setAttribute("aria-pressed", "true");
    box.appendChild(cell);
  }
}

function eventLine(e) {
  const cls = e.kind === "world" ? "world" : e.kind === "loss" ? "loss"
            : e.kind === "kept" ? "kept" : "";
  return '<li><span class="tag ' + cls + '">' + months()[e.month] + "</span><span>" +
    eventText(e) + "</span></li>";
}

function eventText(e) {
  const life = state.life;
  if (state.lang === "hr" && e.text.startsWith("raises it — ")) {
    const hurt = e.text.slice("raises it — ".length).split(" — ")[0];
    return t("raisedIt").replace(/^\S+\s/, "") + " " + w(hurt) + t("raisedAt");
  }
  return w(e.text);
}

function drawYearCard() {
  const life = state.life, card = $("#yearcard");
  const age = state.year === null ? Math.floor((life.days.length - 1) / 365) : state.year;
  const y = tallyYear(age);
  if (!y.days) { card.innerHTML = '<p class="note">' + t("noYear") + "</p>"; return; }
  const most = [...y.done.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([n]) => w(n)).join(" · ");
  const think = [...y.thoughts.entries()].sort((a, b) => b[1] - a[1])[0];
  let html = '<div><span class="age num">' + age + '</span><span class="stage">' +
    w(stageAt(age)) + "</span></div>";
  html += '<p class="mostly">' + t("mostly") + ": " + most + "</p>";
  if (think) html += '<p class="thought">' + t("thoughtOf") + ": " + w(think[0]) + "</p>";
  const here = life.events.filter((e) => e.age === age);
  if (here.length) html += "<ul>" + here.map(eventLine).join("") + "</ul>";
  card.innerHTML = html;
}

// ---- act three: what it came to -----------------------------------------

const CAT_COLOUR = {
  work: "var(--trace)", rest: "color-mix(in srgb, var(--trace) 38%, transparent)",
  care: "color-mix(in srgb, var(--trace) 62%, transparent)",
  worry: "var(--loss)", house: "var(--world)",
  school: "color-mix(in srgb, var(--world) 45%, transparent)",
  body: "color-mix(in srgb, var(--loss) 45%, transparent)",
  regret: "color-mix(in srgb, var(--loss) 72%, transparent)",
  other: "var(--grid)",
};

function drawAccount() {
  const life = state.life, box = $("#account");
  const by = new Map();
  let total = 0;
  for (const [name, minutes] of life.doneMinutes) {
    const cat = CAT_OF[name] || "other";
    by.set(cat, (by.get(cat) || 0) + minutes);
    total += minutes;
  }
  const order = CAT_ORDER.filter((c) => by.get(c));
  const lifeMinutes = (life.diedAt[0] || 1) * 365 * 1440;

  let html = "<h3>" + t("whereItWent") + "</h3>";
  html += '<div class="went">' + order.map((c) =>
    '<div style="width:' + (100 * by.get(c) / total).toFixed(2) + "%;background:" +
    CAT_COLOUR[c] + '" title="' + w(c + "_cat") + '"></div>').join("") + "</div>";
  html += '<div class="wentkey">' + order.map((c) =>
    '<div class="row"><span class="sw" style="background:' + CAT_COLOUR[c] + '"></span>' +
    "<span>" + w(c + "_cat") + '</span><span class="yr">' + spanOf(by.get(c)) +
    "</span></div>").join("") + "</div>";

  html += '<p class="big">' + t("awakeLine").replace("%1", spanOf(total))
    .replace("%2", String(life.diedAt[0])) + "</p>";

  const figures = [
    [num(life.totalThoughts), t("thoughts") + ", " + life.thoughtCount.size + " " + t("different")],
    [num(life.mornings), state.lang === "hr" ? "jutara" : "mornings"],
    [num(life.insomniaNights), t("nightsAwake")],
    [num(life.neverTotal), state.lang === "hr" ? "puta je znao bolje" : "things you knew better"],
    [num(life.questions), t("questions")],
  ];
  if (life.worstNight[0]) {
    figures.push([life.worstNight[0], t("worstLine")
      .replace("%1", String(life.worstNight[1])).replace("%2", life.worstNight[2])]);
  }
  html += '<div class="figures">' + figures.map(([v, k]) =>
    '<div class="fig"><span class="v">' + v + '</span><span class="k">' + k +
    "</span></div>").join("") + "</div>";

  const left = life.shouldDo.map((d) => d.name);
  html += "<h3>" + t("stillMeaning") + " (" + t("meantNote").toLowerCase() + " " +
    life.rememberedTotal + " " + t("times") + ")</h3>";
  html += left.length
    ? "<ul>" + left.map((n) => "<li>" + w(n) + "</li>").join("") + "</ul>"
    : '<p class="note">' + t("nothingLeft") + "</p>";
  if (life.motherDied !== undefined) {
    html += "<blockquote>„" + w("call your mother") + "” " +
      (state.lang === "hr"
        ? "otišlo je s popisa u " + life.motherDied + " i nije se moglo vratiti."
        : "left the list at " + life.motherDied + ", and could not be added again.") +
      "</blockquote>";
  }

  if (life.worldEvents.length) {
    html += "<h3>" + t("outside") + "</h3><ul>" + life.worldEvents.map((e) =>
      '<li><span class="n">' + e.age + " " + months()[e.month] + "</span><span>" +
      w(e.text) + "</span></li>").join("") + "</ul>";
  }

  const skills = life.skills.map((s) => w(s)).join(" · ");
  if (skills) html += "<h3>" + t("keptFromSchool") + "</h3><p>" + skills + "</p>";

  html = '<p class="big">' + t("died") + " " + life.diedAt[0] + ", " + t("at") + " " +
    life.diedAt[1] + ", " + t("gotUp") + " " + num(life.mornings) + " " + t("timesUp") +
    ".</p>" + (life.cause
      ? '<p class="note" style="color:var(--loss)">' + t("inTheYearOf") + " " +
        w(life.cause) + ".</p>" : "") + html;
  box.innerHTML = html;
}

// ---- watching it happen again, if you want to ---------------------------

function replay() {
  const box = $("#years");
  const cells = [...box.querySelectorAll(".cell")];
  box.classList.add("reveal");
  cells.forEach((c) => c.classList.remove("shown"));
  let i = 0;
  const step = () => {
    if (i >= cells.length) { box.classList.remove("reveal"); return; }
    cells[i++].classList.add("shown");
    setTimeout(step, 55);
  };
  step();
}

// ------------------------------------------------------------------ wiring

function init() {
  chrome(); buildSetup();
  $("#start").addEventListener("click", live);
  $("#again").addEventListener("click", () => {
    state.seed = Math.floor(Math.random() * 1e6);
    buildSetup(); live(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#replay").addEventListener("click", replay);
  $("#lang").addEventListener("click", () => {
    state.lang = state.lang === "hr" ? "en" : "hr";
    chrome(); buildSetup();
    if (state.life) drawAll();
  });
}

init();
</script>
